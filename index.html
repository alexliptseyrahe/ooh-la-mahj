<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ooh La Mahj">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C3B2E">
<title>Ooh La Mahj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#11594400; /* placeholder */
  --deep:#0C3B2E;
  --deep2:#0F4A39;
  --emerald:#156146;
  --emerald-lt:#1E7A58;
  --ivory:#FBF7EC;
  --cream:#F3EBD8;
  --gold:#C9A24B;
  --gold-dk:#A5822F;
  --gold-pale:#E8D9AE;
  --coral:#E2725B;
  --coral-dk:#C85B45;
  --pink:#F2C9BC;
  --ink:#22332B;
  --red:#B23A2F;
  --grn:#1B6B4C;
  --blu:#2C5F82;
  --paper:#FAF9F5;
  --tile-face:#FFFDF4;
  --tile-face2:#F5EEDB;
  --tile-edge:#E0D6B8;
  --shadow:0 2px 5px rgba(10,25,18,.35);
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Jost', 'Avenir Next', -apple-system, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{--bg1:#14523F;--bg2:#0C3B2E;--bg3:#082E23}
body{
  font-family:var(--sans);
  color:var(--ivory);
  background-color:var(--deep);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,.028) 16px 17px),
    repeating-linear-gradient(-45deg, transparent 0 16px, rgba(255,255,255,.028) 16px 17px),
    radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  transition:background-color .4s;
  display:flex;flex-direction:column;
  height:100dvh;
  user-select:none;-webkit-user-select:none;
}
button{font-family:var(--sans);border:none;cursor:pointer;background:none;color:inherit}

/* ---------- generic tile ---------- */
.tile{
  position:relative;flex:none;
  background:linear-gradient(165deg,var(--tile-face) 0%,var(--tile-face) 55%,var(--tile-face2) 100%);
  border:1px solid var(--tile-edge);
  border-radius:8px;
  box-shadow:var(--shadow), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(160,140,90,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink);
  overflow:hidden;
  transition:transform .14s ease, box-shadow .14s ease;
}
.tile .n{font-family:var(--serif);font-weight:700;line-height:.9}
.tile .m{line-height:1;display:flex;align-items:center;justify-content:center}
.tile .lbl{font-family:var(--sans);font-weight:600;letter-spacing:.14em;line-height:1}
.tile.red .n{color:var(--red)} .tile.grn .n{color:var(--grn)} .tile.blu .n{color:var(--blu)}
.tile.back{background:linear-gradient(160deg,#17604A,#0F4A39);border-color:#0A2E24}
.tile.back::after{content:'';position:absolute;inset:3px;border:1px solid rgba(201,162,75,.55);border-radius:5px;
  background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(201,162,75,.13) 5px 6px)}

/* rack size */
.t-lg{width:min(12.2vw,52px);aspect-ratio:13/17}
.t-lg .n{font-size:clamp(19px,6vw,26px)}
.t-lg .m svg{width:clamp(12px,3.8vw,16px);height:clamp(12px,3.8vw,16px)}
.t-lg .m .zi{font-size:clamp(11px,3.4vw,14px)}
.t-lg .lbl{font-size:7px;margin-top:2px}
/* mid (exposures, win display) */
.t-md{width:34px;aspect-ratio:13/17;border-radius:6px}
.t-md .n{font-size:17px}
.t-md .m svg{width:10px;height:10px}
.t-md .m .zi{font-size:9px}
.t-md .lbl{font-size:5px;margin-top:1px}
/* small (discards) */
.t-sm{width:29px;aspect-ratio:13/17;border-radius:5px}
.t-sm .n{font-size:15px}
.t-sm .m svg{width:9px;height:9px}
.t-sm .m .zi{font-size:8px}
.t-sm .lbl{font-size:4.5px;margin-top:1px}
/* tiny (opponent exposures) */
.t-xs{width:20px;aspect-ratio:13/17;border-radius:4px;box-shadow:0 1px 2px rgba(10,25,18,.3)}
.t-xs .n{font-size:10px}
.t-xs .m svg{width:6px;height:6px}
.t-xs .m .zi{font-size:5.5px}
.t-xs .lbl{font-size:3.5px}

.tile.joker{background:linear-gradient(165deg,#125441,#0D4232);border-color:#0A2E24;color:var(--gold-pale)}
.tile.joker .lbl{color:var(--gold);letter-spacing:.16em}
.tile.sel{transform:translateY(-9px);box-shadow:0 8px 14px rgba(10,25,18,.5),0 0 0 2px var(--coral), inset 0 1.5px 0 rgba(255,255,255,.9)}
.tile.just{outline:2px solid var(--coral);outline-offset:1px}

/* ---------- layout ---------- */
#hdr{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top, 8px) + 6px) 14px 8px;
}
#hdr .brand{font-family:var(--serif);font-weight:600;letter-spacing:.22em;font-size:13px;color:var(--gold-pale)}
#hdr .brand b{color:var(--gold);font-weight:700}
#wallct{font-size:12.5px;letter-spacing:.12em;color:rgba(251,247,236,.75)}
#wallct b{color:var(--gold);font-weight:600}
#hdr .hbtn{font-size:11.5px;letter-spacing:.12em;color:var(--gold-pale);border:1px solid rgba(201,162,75,.5);border-radius:14px;padding:4px 9px}

#opps{flex:none;display:flex;gap:8px;padding:2px 10px 6px}
.opp{
  flex:1;background:rgba(8,40,30,.5);border:1px solid rgba(201,162,75,.25);border-radius:12px;
  padding:6px 8px 7px;display:flex;flex-direction:column;gap:4px;min-width:0;
  transition:border-color .2s, box-shadow .2s;
}
.opp .oname{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.08em;color:var(--ivory)}
.opp .dotad{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.opp.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,162,75,.5),0 0 14px rgba(201,162,75,.25)}
.opp.active .dotad{background:var(--coral);box-shadow:0 0 6px var(--coral)}
.opp .octr{font-size:11px;color:rgba(251,247,236,.55);letter-spacing:.1em}
.opp .oexp{display:flex;gap:2px;flex-wrap:wrap;min-height:0}

#board{
  flex:1;min-height:0;margin:2px 10px;display:flex;flex-direction:column;
  background:rgba(6,32,24,.35);
  border:1px solid rgba(201,162,75,.28);border-radius:16px;
  position:relative;overflow:hidden;
}
#board .btitle{flex:none;text-align:center;font-size:10.5px;letter-spacing:.3em;color:rgba(232,217,174,.6);padding:7px 0 2px}
#discards{
  flex:1;overflow-y:auto;padding:6px 10px 10px;
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;
}
#tablemsg{
  position:absolute;inset:auto 0 0 0;top:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;text-align:center;padding:0 30px;
}
#tablemsg span{
  font-family:var(--serif);font-size:19px;font-weight:600;color:var(--gold-pale);
  text-shadow:0 2px 8px rgba(0,0,0,.5);line-height:1.3;
}

#me{flex:none;padding:4px 8px calc(env(safe-area-inset-bottom, 10px) + 8px)}
#myexp{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;padding:2px 0 5px;min-height:0}
#myexp .egrp{display:flex;gap:2px;background:rgba(8,40,30,.5);border:1px solid rgba(201,162,75,.3);border-radius:8px;padding:3px 4px}
#rack{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 0 2px}
#rack .tile{touch-action:none}
.tile.hint{box-shadow:0 2px 5px rgba(10,25,18,.35),0 0 0 2px var(--gold),0 0 12px rgba(201,162,75,.65), inset 0 1.5px 0 rgba(255,255,255,.9)}
.tile.dim{opacity:.5}
#rackbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:2px 6px 0}
.mini{font-size:11.5px;letter-spacing:.18em;color:var(--gold-pale);border:1px solid rgba(201,162,75,.45);border-radius:12px;padding:4px 11px}
.mini.on{background:rgba(201,162,75,.3);color:#fff;border-color:var(--gold)}
#actions{
  display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;
  min-height:46px;padding-top:6px;
}
.abtn{
  font-size:13px;font-weight:600;letter-spacing:.14em;
  padding:11px 22px;border-radius:24px;color:#fff;
  background:linear-gradient(160deg,var(--coral),var(--coral-dk));
  box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.abtn:active{transform:translateY(1px)}
.abtn.gold{background:linear-gradient(160deg,#A8893C,#8A6F2F);color:#FBF7EC}
.abtn.ghost{background:none;border:1px solid rgba(251,247,236,.45);box-shadow:none;color:var(--ivory);font-weight:500}
.abtn.big{font-size:15px;padding:13px 30px}
.abtn:disabled{opacity:.4;pointer-events:none}
#statusline{text-align:center;font-size:14px;letter-spacing:.1em;color:rgba(251,247,236,.8);min-height:16px;padding-top:2px}
/* tablets & desktop: centered table, generous tiles */
@media (min-width:700px){
  #hdr,#opps{max-width:920px;margin-left:auto;margin-right:auto;width:100%}
  #board{max-width:920px;margin-left:auto;margin-right:auto;width:calc(100% - 20px)}
  #me{max-width:1120px;margin:0 auto;width:100%}
  .t-lg{width:min(6.2vw,68px)}
  .t-lg .n{font-size:clamp(22px,3.4vw,33px)}
  .t-lg .m svg{width:clamp(14px,2.1vw,21px);height:clamp(14px,2.1vw,21px)}
  .t-lg .m .zi{font-size:clamp(13px,1.9vw,18px)}
  .t-lg .lbl{font-size:9px}
  .t-md{width:42px}
  .t-md .n{font-size:21px}
  .t-md .m svg{width:13px;height:13px}
  .t-md .m .zi{font-size:11px}
  .t-sm{width:36px}
  .t-sm .n{font-size:18px}
  .t-sm .m svg{width:11px;height:11px}
  .t-sm .m .zi{font-size:10px}
  .t-xs{width:26px}
  .t-xs .n{font-size:13px}
  #discards{gap:6px;padding:10px 14px 14px}
  #tablemsg span{font-size:26px}
  #statusline{font-size:13px}
}
#statusline b{color:var(--gold)}

/* ---------- title screen ---------- */
#title{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background-color:var(--deep);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,.03) 16px 17px),
    repeating-linear-gradient(-45deg, transparent 0 16px, rgba(255,255,255,.03) 16px 17px),
    radial-gradient(130% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  transition:opacity .5s;text-align:center;padding:30px;
}
#title.hide{opacity:0;pointer-events:none}
#titlemural{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#title>*:not(#titlemural){position:relative;z-index:1}
.matrow{display:flex;gap:14px;margin-top:30px;align-items:center}
.matsw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:all .2s}
.matsw.on{border-color:var(--gold);box-shadow:0 0 12px rgba(201,162,75,.55);transform:scale(1.12)}
#matname{font-size:10.5px;letter-spacing:.32em;color:rgba(232,217,174,.7);margin-top:10px}
#matlabel{font-size:10px;letter-spacing:.3em;color:rgba(251,247,236,.5);margin-top:26px}
#btnmat{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(201,162,75,.6);margin-right:8px}
.crest{
  width:150px;height:150px;border-radius:50%;flex:none;
  border:1.5px solid var(--gold);position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:26px;
  box-shadow:0 0 40px rgba(201,162,75,.15), inset 0 0 30px rgba(201,162,75,.08);
}
.crest::before{content:'';position:absolute;inset:7px;border:1px solid rgba(201,162,75,.55);border-radius:50%}
.crest svg{width:74px;height:74px}
@media (max-height:800px){
  .crest{width:116px;height:116px;margin-bottom:16px}
  .crest svg{width:60px;height:60px}
  #title .est{margin:10px 0 22px}
}
#title h1{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.3em;margin-left:.3em;color:var(--ivory);line-height:1.15}
#title h2{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.5em;margin:6px 0 2px .5em;color:var(--gold)}
#title .est{font-size:10px;letter-spacing:.4em;color:rgba(232,217,174,.65);margin:14px 0 34px}
#title .est::before,#title .est::after{content:'—';margin:0 10px;color:rgba(201,162,75,.5)}
#title .tbtns{display:flex;flex-direction:column;gap:14px;align-items:center}

/* ---------- card sheet ---------- */
#sheet{
  position:fixed;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;
  background:rgba(5,20,15,.55);backdrop-filter:blur(3px);
}
#sheet.open{display:flex}
#sheetin{
  background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;
  max-height:82dvh;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.4);
}
#sheetin .grab{flex:none;width:44px;height:4px;border-radius:2px;background:#CFC9BC;margin:10px auto 4px}
#sheetin h3{
  font-family:var(--serif);font-weight:700;text-align:center;font-size:19px;letter-spacing:.18em;color:var(--deep);
  padding:4px 0 2px;
}
#sheetin .sub{text-align:center;font-size:10px;letter-spacing:.22em;color:#8A7F5F;padding-bottom:8px;border-bottom:1px solid #E7E3DA}
#cardlist{overflow-y:auto;padding:10px 16px calc(env(safe-area-inset-bottom,10px) + 16px)}
#cardctl{display:flex;gap:6px;justify-content:center;padding:9px 0 2px}
.cbtn{font-size:11px;font-weight:600;letter-spacing:.16em;color:#6B6248;border:1px solid #CFC9BC;border-radius:13px;padding:5px 13px;background:#fff}
.cbtn.on{background:var(--deep);color:var(--gold-pale);border-color:var(--deep)}
.cbtn.imp{color:var(--coral-dk);border-color:var(--coral)}
.cbtn:disabled{opacity:.35}
#imparea{width:100%;height:90px;border:1px solid #CFC9BC;border-radius:10px;padding:8px;font-size:11px;font-family:monospace;margin:8px 0;resize:none;background:#FCFBF9;color:var(--ink)}
#impfile{font-size:12px;margin:2px 0 6px;max-width:100%}
.imperr{color:var(--red);font-size:13px;min-height:16px;margin-bottom:6px}
.photozone{border:none;border-radius:16px;padding:16px 12px;text-align:center;margin:10px 0;background:#F1EFE9}
.orpill{display:flex;align-items:center;gap:10px;margin:4px 0}
.orpill::before,.orpill::after{content:'';flex:1;height:1px;background:#E4E1D8}
.orpill span{font-size:10px;letter-spacing:.26em;color:#A8A296}
.photozone .pz1{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--deep)}
.photozone .pz2{font-size:13px;color:#8A7F5F;margin:6px 0 12px;line-height:1.5}
.pslots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.pslot{width:88px;height:66px;border:none;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(40,50,44,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden;position:relative;padding:0}
.pslot span{font-size:10.5px;letter-spacing:.14em;color:#8A7F5F;font-weight:600}
.pslot b{font-size:17px;color:var(--coral-dk);line-height:1}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot.filled{border-style:solid;border-color:var(--grn)}
.pslot.filled::after{content:'✓';position:absolute;top:2px;right:5px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)}
details.altimp{margin-top:12px;text-align:left}
details.altimp summary{font-size:12px;letter-spacing:.08em;color:#8A7F5F;cursor:pointer}
.spin{width:34px;height:34px;border:3px solid #E7E3DA;border-top-color:var(--coral);border-radius:50%;margin:14px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.revlist{max-height:200px;overflow-y:auto;text-align:left;border:1px solid #E7E3DA;border-radius:10px;padding:8px 10px;margin:10px 0;font-size:13px;line-height:1.7;color:#3E4E45}
.revlist b{color:var(--deep)}
.revcat{font-size:10.5px;letter-spacing:.2em;color:var(--gold-dk);margin-top:6px}
.ccat{font-size:10.5px;font-weight:600;letter-spacing:.26em;color:var(--gold-dk);margin:14px 0 6px}
.chand{
  background:#fff;border:1px solid #EAE7E0;border-radius:12px;padding:10px 12px;margin-bottom:8px;
  display:flex;flex-direction:column;gap:6px;
}
.chand.best{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}
.chand .chtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chand .chname{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--deep)}
.chand .chpts{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--gold-dk);white-space:nowrap}
.chand .chpat{font-family:var(--sans);font-size:13px;letter-spacing:.06em;color:#4A5A50;display:flex;flex-wrap:wrap;gap:4px}
.chand .chpat i{font-style:normal;padding:2px 6px;border-radius:5px;background:#F1EFEA;font-weight:500}
.chand .chpat i.cR{color:var(--red)} .chand .chpat i.cG{color:var(--grn)} .chand .chpat i.cB{color:var(--blu)}
.chand .chpat i.cN{color:#33413A} .chand .chpat i.cF{color:var(--coral-dk)}
.chand .prog{display:flex;align-items:center;gap:8px}
.chand .bar{flex:1;height:5px;border-radius:3px;background:#EAE2C8;overflow:hidden}
.chand .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .3s}
.chand .away{font-size:11.5px;color:#8A7F5F;letter-spacing:.06em;white-space:nowrap}
.chand .cnote{font-size:11.5px;color:#A08F63;letter-spacing:.08em}

/* ---------- call bar ---------- */
#callbar{
  position:fixed;left:10px;right:10px;top:130px;bottom:auto;z-index:40;display:none;
  background:rgba(6,25,19,.98);border:1px solid var(--gold);border-radius:16px;padding:15px 16px 14px;
  flex-direction:column;gap:11px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.55);
}
#callbar.open{display:flex}
#callbar .cq{font-family:var(--serif);font-size:17px;color:var(--gold-pale);text-align:center}
.bopt{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;
  background:#fff;border:1px solid #EAE7E0;border-radius:13px;padding:10px 12px;margin-bottom:7px;text-align:left}
.bopt .bnm{display:block;font-size:12.5px;font-weight:700;color:var(--deep);letter-spacing:.06em}
.bopt .bds{display:block;font-size:10.5px;color:#8A7F5F;margin-top:1px}
.bopt .bck{width:19px;height:19px;border-radius:50%;border:1.5px solid #D9D5CB;flex:none;margin-left:10px;position:relative}
.bopt.on{border-color:var(--gold)}
.bopt.on .bck{background:var(--deep);border-color:var(--deep)}
.bopt.on .bck::after{content:'✓';color:#E8C97E;font-size:12px;position:absolute;left:4.5px;top:1px}
.calladv{font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:var(--gold);margin-top:8px;line-height:1.45;text-align:center;padding:0 4px}
#callbar .cbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- modal ---------- */
#modal{
  position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;
  background:rgba(8,30,23,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#modal.open{display:flex}
#modalin{
  background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;
  padding:11px 22px calc(env(safe-area-inset-bottom,10px) + 18px);max-width:520px;width:100%;
  text-align:center;box-shadow:0 -14px 44px rgba(0,0,0,.4);max-height:88dvh;overflow-y:auto;
  transform:translateY(100%);animation:sheetup .42s cubic-bezier(.22,1.12,.36,1) forwards;
}
@keyframes sheetup{to{transform:translateY(0)}}
#modalin::before{content:'';display:block;width:38px;height:4.5px;border-radius:3px;background:#DFDBD1;margin:0 auto 13px}
@media (prefers-reduced-motion:reduce){#modalin{animation:none;transform:none}}
#modal.kb{align-items:flex-start}
#modal.kb #modalin{
  border-radius:22px;animation:none;transform:none;max-height:46dvh;padding-top:16px;
  margin:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;width:calc(100% - 20px);
  box-shadow:0 10px 36px rgba(0,0,0,.45);
}
#modal.kb #modalin::before{display:none}
#modalin .mtop{font-size:10px;letter-spacing:.34em;color:var(--gold-dk);margin-bottom:8px}
#modalin h2{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--deep);letter-spacing:.06em;line-height:1.1}
#modalin .msub{font-size:14px;color:#5A6A60;margin:10px 0 4px;line-height:1.5}
#modalin .mtiles{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.debrief{border-top:1px solid #E8E5DE;margin-top:16px;padding-top:13px}
.dbhead{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:#A8893C;font-weight:600}
#modalin .mpts{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--coral-dk);margin:6px 0 16px}
#modalin .mbtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;flex-direction:column;align-items:stretch}
#modalin .mbtns .abtn{width:100%;box-sizing:border-box}
#modalin .rules{text-align:left;font-size:13px;line-height:1.65;color:#3E4E45}

#modalin .rules p{margin-bottom:9px}

.fade{animation:fadein .35s ease}

<script>
/* ============ THE PALM CLUB MAH JONGG ============ */
'use strict';
const $=id=>document.getElementById(id);

/* extra CSS for center-art tiles */
document.head.insertAdjacentHTML('beforeend',`<style>
*{touch-action:manipulation}
.tile .lbl{color:#8A7F5F}
.t-lg .m.art svg{width:27px;height:27px}
.t-md .m.art svg{width:17px;height:17px}
.t-sm .m.art svg{width:14px;height:14px}
.t-xs .m.art svg{width:9px;height:9px}
.t-lg .nz{font-size:clamp(21px,6.6vw,28px)}
.t-md .nz{font-size:18px}.t-sm .nz{font-size:15px}.t-xs .nz{font-size:10px}
</style>`);

/* ---------- tiles ---------- */
const SUITS=['C','B','D'];
const SUITCLR={C:'red',B:'grn',D:'blu'};
const DRAGON={C:'GR',B:'GG',D:'G0'};
const WINDS=['WN','WE','WW','WS'];
const key=t=>t.s+(t.n!==undefined?t.n:'');
let _tid=0;
function mk(s,n){return {s,n,id:++_tid}}
function makeDeck(){
  const d=[];
  for(const s of SUITS) for(let n=1;n<=9;n++) for(let i=0;i<4;i++) d.push(mk(s,n));
  for(const w of ['N','E','W','S']) for(let i=0;i<4;i++) d.push(mk('W',w));
  for(const g of ['R','G','0']) for(let i=0;i<4;i++) d.push(mk('G',g));
  for(let i=0;i<8;i++) d.push(mk('F',undefined));
  for(let i=0;i<8;i++) d.push(mk('J',undefined));
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const SVGS={
  bam:c=>`<svg viewBox="0 0 24 24"><g fill="${c}"><rect x="3.5" y="3" width="4.4" height="18" rx="2.2"/><rect x="9.8" y="3" width="4.4" height="18" rx="2.2"/><rect x="16.1" y="3" width="4.4" height="18" rx="2.2"/></g></svg>`,
  dot:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="${c}" stroke-width="3"/><circle cx="12" cy="12" r="3.1" fill="${c}"/></svg>`,
  soap:c=>`<svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3.5" fill="none" stroke="${c}" stroke-width="2.6"/><rect x="8.5" y="8" width="7" height="8" rx="1.6" fill="none" stroke="${c}" stroke-width="1.4" opacity=".55"/></svg>`,
  flower:`<svg viewBox="0 0 24 24"><g fill="#E2725B"><ellipse cx="12" cy="5.4" rx="3.1" ry="4.2"/><ellipse cx="12" cy="18.6" rx="3.1" ry="4.2"/><ellipse cx="5.4" cy="12" rx="4.2" ry="3.1"/><ellipse cx="18.6" cy="12" rx="4.2" ry="3.1"/><ellipse cx="7.4" cy="7.4" rx="2.9" ry="2.9" opacity=".7"/><ellipse cx="16.6" cy="7.4" rx="2.9" ry="2.9" opacity=".7"/><ellipse cx="7.4" cy="16.6" rx="2.9" ry="2.9" opacity=".7"/><ellipse cx="16.6" cy="16.6" rx="2.9" ry="2.9" opacity=".7"/></g><circle cx="12" cy="12" r="3" fill="#C9A24B"/></svg>`,
  palm:`<svg viewBox="0 0 80 80" fill="none"><path d="M40 70 C40 52 39 42 40 30" stroke="#C9A24B" stroke-width="4" stroke-linecap="round"/><path d="M40 32 C30 24 18 24 10 30 C20 32 30 34 40 32 Z" fill="#C9A24B"/><path d="M40 32 C50 24 62 24 70 30 C60 32 50 34 40 32 Z" fill="#C9A24B"/><path d="M40 31 C34 20 26 14 16 14 C24 20 32 28 40 31 Z" fill="#C9A24B" opacity=".8"/><path d="M40 31 C46 20 54 14 64 14 C56 20 48 28 40 31 Z" fill="#C9A24B" opacity=".8"/><path d="M40 30 C38 18 40 10 40 6 C42 14 42 22 40 30 Z" fill="#C9A24B"/></svg>`
};
function tileDOM(t,size){
  const d=document.createElement('div');
  d.className='tile '+size;
  if(!t){d.classList.add('back');return d}
  d.dataset.id=t.id;
  const n=document.createElement('span');
  const m=document.createElement('span'); m.className='m';
  const l=document.createElement('span'); l.className='lbl';
  if(t.s==='C'||t.s==='B'||t.s==='D'){
    d.classList.add(SUITCLR[t.s]);
    n.className='n'; n.textContent=t.n;
    if(t.s==='C') m.innerHTML=`<span class="zi" style="color:var(--red);font-weight:600">萬</span>`;
    else if(t.s==='B') m.innerHTML=SVGS.bam('var(--grn)');
    else m.innerHTML=SVGS.dot('var(--blu)');
    d.append(n,m);
  }else if(t.s==='W'){
    n.className='n'; n.style.color='#33413A'; n.textContent=t.n;
    l.textContent='WIND';
    d.append(n,l);
  }else if(t.s==='G'){
    if(t.n==='R'){n.className='n nz';n.style.color='var(--red)';n.textContent='中';l.textContent='RED';d.append(n,l)}
    else if(t.n==='G'){n.className='n nz';n.style.color='var(--grn)';n.textContent='發';l.textContent='GREEN';d.append(n,l)}
    else{m.classList.add('art');m.innerHTML=SVGS.soap('var(--blu)');l.textContent='SOAP';d.append(m,l)}
  }else if(t.s==='F'){
    m.classList.add('art'); m.innerHTML=SVGS.flower; l.textContent='FLOWER';
    d.append(m,l);
  }else{
    d.classList.add('joker');
    m.classList.add('art'); m.innerHTML=SVGS.palm; l.textContent='JOKER';
    d.append(m,l);
  }
  return d;
}
function nameOf(t){
  if(t.s==='C')return t.n+' Crak'; if(t.s==='B')return t.n+' Bam'; if(t.s==='D')return t.n+' Dot';
  if(t.s==='W')return {N:'North',E:'East',W:'West',S:'South'}[t.n];
  if(t.s==='G')return {R:'Red Dragon',G:'Green Dragon',0:'Soap'}[t.n];
  if(t.s==='F')return 'Flower'; return 'Joker';
}
const ORD={C:0,B:1,D:2,W:3,G:4,F:5,J:6};
const SUBORD={N:1,E:2,W:3,S:4,R:1,G:2,0:3};
function sortHand(h){
  return [...h].sort((a,b)=>{
    if(ORD[a.s]!==ORD[b.s])return ORD[a.s]-ORD[b.s];
    const av=typeof a.n==='number'?a.n:(SUBORD[a.n]||0), bv=typeof b.n==='number'?b.n:(SUBORD[b.n]||0);
    return av-bv;
  });
}

const CLUB_HANDS=[];
let HANDS=CLUB_HANDS,CUSTOM=null;
function addHand(h,gen){h.variants=gen();CLUB_HANDS.push(h)}

  disp:[['222','cR'],['0000','cN'],['222','cG'],['6666','cB']],

  ()=>{const v=[];for(const c of SUITS){const o=SUITS.filter(s=>s!==c);
    v.push([[o[0]+'2',3],['G0',4],[o[1]+'2',3],[c+'6',4]])}return v});

  disp:[['11 222 3333 444 55','cR']],

  ()=>{const v=[];for(const s of SUITS)for(let n=1;n<=5;n++)
    v.push([[s+n,2],[s+(n+1),3],[s+(n+2),4],[s+(n+3),3],[s+(n+4),2]]);return v});

  ()=>{const v=[];for(const p of PERMS)for(let n=1;n<=5;n++)
    v.push([[p[0]+n,2],[p[0]+(n+1),2],[p[1]+(n+2),3],[p[1]+(n+3),3],[p[2]+(n+4),4]]);return v});

  disp:[['FF','cF'],['1111','cR'],['1111','cG'],['1111','cB']],
  note:'Any like number · kongs in all three suits'},
  ()=>{const v=[];for(let n=1;n<=9;n++)
    v.push([['F',2],['C'+n,4],['B'+n,4],['D'+n,4]]);return v});
addHand({name:'The Trellis',cat:'PUNGS & DRAGONS',pts:30,concealed:false,
  disp:[['111 222 333 444','cG'],['DD','cG']],
  note:'Any one suit, four consecutive pungs · pair of matching dragons'},
  ()=>{const v=[];for(const s of SUITS)for(let n=1;n<=6;n++)
    v.push([[s+n,3],[s+(n+1),3],[s+(n+2),3],[s+(n+3),3],[DRAGON[s],2]]);return v});
addHand({name:'Dragon Garden',cat:'PUNGS & DRAGONS',pts:35,concealed:false,
  disp:[['FFFF','cF'],['DDDD','cR'],['DDDD','cG'],['DD','cB']],
  note:'Kongs of two dragons · pair of the third'},
  ()=>{const D=['GR','GG','G0'],v=[];for(const pr of D){const o=D.filter(x=>x!==pr);
    v.push([['F',4],[o[0],4],[o[1],4],[pr,2]])}return v});
addHand({name:'Four Winds',cat:'WINDS',pts:30,concealed:false,
  disp:[['NNNN EEEE WWWW','cN'],['SS','cN']],
  note:'Kongs of any three winds · pair of the fourth'},
  ()=>{const v=[];for(const pr of WINDS){const o=WINDS.filter(x=>x!==pr);
    v.push([[o[0],4],[o[1],4],[o[2],4],[pr,2]])}return v});
addHand({name:'Quint Royale',cat:'QUINTS',pts:40,concealed:false,
  disp:[['FFFF','cF'],['11111','cR'],['22222','cG']],
  note:'Quints of any two consecutive numbers · any suits · needs jokers'},
  ()=>{const v=[];for(const a of SUITS)for(const b of SUITS)for(let n=1;n<=8;n++)
    v.push([['F',4],[a+n,5],[b+(n+1),5]]);return v});
addHand({name:'Flamingo Pairs',cat:'SINGLES & PAIRS',pts:50,concealed:true,
  disp:[['NN EE WW SS','cN'],['11 22 33','cR']],
  note:'Concealed · no jokers · any one suit, three consecutive pairs'},
  ()=>{const v=[];for(const s of SUITS)for(let n=1;n<=7;n++)
    v.push([['WN',2],['WE',2],['WW',2],['WS',2],[s+n,2],[s+(n+1),2],[s+(n+2),2]]);return v});

const STAGE_B_HEAD=`You are given transcribed lines from one panel of an American mah jongg scoring card. Convert EVERY line into a compact JSON notation. Each input line gives: text (tile groups as printed), colors (segments printed in the SAME color share a suit; DIFFERENT colors are different suits; flowers, winds, soap/zero and standalone dragons are neutral), ann (the annotation - TRUST THIS over colors if they conflict), val (X=exposed so "c":false, C=concealed so "c":true; the number is "pts"), cat (section).

TILES: three suits exist (we call them a, b, c - distinct suits). Colors on the card indicate suit grouping: groups printed in the SAME color share a suit; DIFFERENT colors mean different suits. Black is also a suit color.

GROUP SYNTAX: each group is "<count>:<tiles>" where count 1-6 is how many tiles.
- Number tile in a suit: "2a" (a 2 in suit a), "7b", etc.
- "0" = white dragon used as zero (soap).
- "F" = flower. "N","E","W","S" = winds.
- "DR","DG","DW" = specific red/green/white dragon.
- "da" = the dragon MATCHING suit a (likewise "db","dc").
- "xa" = a dragon NOT matching suit a (opposite dragon).
- "dd" = any one dragon (same dragon throughout the alternative).
- Variable number: "na" = number n in suit a; "n1a" = n+1 in suit a, up to "n6a". Set n's range with "n" field: "1-5", "odd", "even", "1,5", "1-9".
- "ma" = a second independent number m (never equal to n), range via "m".
- "pa" = a chosen number p, range via "p" (e.g. "2,4,6,8" for "kong 2, 4, 6 or 8").

HAND ENTRY: {"name":"<the line as printed, e.g. 222 000 2222 6666>","cat":"<section header, e.g. 2026>","pts":<number>,"c":<true if value marked C (concealed), false if X>,"note":"<the parenthetical annotation>","alts":[{...}]}
Each alt is one concrete arrangement: {"g":["3:2a","3:0","4:2b","4:6b"],"n":"1-5"} (n/m/p fields only when used). Group counts in an alt MUST total 14.

- When a hand's structure depends on a chosen number in a way p cannot express (e.g. "pair any odd number, singles of the remaining odds"), write one alt per choice, with literal numbers.
- "These Nos. Only" means literal numbers; "Any ... Consec." means use n variables.

function parseNums(spec,maxOff){
  let vals=[];
  if(spec==='odd')vals=[1,3,5,7,9];
  else if(spec==='even')vals=[2,4,6,8];
  else if(/^\d+-\d+$/.test(spec)){const [a,b]=spec.split('-').map(Number);for(let i=a;i<=b;i++)vals.push(i)}
  else vals=spec.split(',').map(Number).filter(x=>x>=1&&x<=9);
  return vals.filter(v=>v+maxOff<=9);
}
function suitAssigns(k){
  if(k===0)return [[]];
  const out=[];
  for(const a of SUITS){
    if(k===1){out.push([a]);continue}
    for(const b of SUITS){if(b===a)continue;
      if(k===2){out.push([a,b]);continue}
      for(const c of SUITS){if(c===a||c===b)continue;out.push([a,b,c])}}}
  return out;
}
function expandCompact(cc){
  if(!cc||!Array.isArray(cc.hands)||!cc.hands.length)throw new Error('No hands found in the reading');
  const DRAGS=['GR','GG','G0'];
  const hands=[],fails=[];
  for(const h of cc.hands){
    const seen=new Set(),variants=[];
    let failReason='';
    for(const alt of (h.alts||[])){
      const toks=[];const suitVars=new Set();
      let useN=false,useM=false,useP=false,useDD=false,xRef=null,maxOff=0,bad=false;
      for(const t of (alt.g||[])){
        const mm=/^([1-6]):(.+)$/.exec(String(t).replace(/\s+/g,''));
        if(!mm){bad=true;failReason='could not parse group "'+t+'"';break}
        const k=+mm[1],sp=mm[2];let r;
        if(/^(F|N|E|W|S|0|DR|DG|DW)$/.test(sp)){}
        else if(sp==='dd')useDD=true;
        else if(r=/^d([abc])$/.exec(sp))suitVars.add(r[1]);
        else if(r=/^x([abc])$/.exec(sp)){suitVars.add(r[1]);xRef=r[1]}
        else if(r=/^([1-9])([abc])$/.exec(sp))suitVars.add(r[2]);
        else if(r=/^n([0-6]?)([abc])$/.exec(sp)){useN=true;suitVars.add(r[2]);maxOff=Math.max(maxOff,+(r[1]||0))}
        else if(r=/^m([abc])$/.exec(sp)){useM=true;suitVars.add(r[1])}
        else if(r=/^p([abc])$/.exec(sp)){useP=true;suitVars.add(r[1])}
        else{bad=true;failReason='unknown tile token "'+sp+'"';break}
        toks.push({k,sp});
      }
      if(bad||!toks.length)continue;
      const tot=toks.reduce((s,t)=>s+t.k,0);
      if(tot!==14){failReason='groups total '+tot+' tiles, must be exactly 14';continue}
      const nV=useN?parseNums(String(alt.n||h.n||'1-9'),maxOff):[0];
      const mV=useM?parseNums(String(alt.m||h.m||'1-9'),0):[0];
      const pV=useP?parseNums(String(alt.p||h.p||'1-9'),0):[0];
      const dV=useDD?DRAGS:[null];
      const sv=[...suitVars];
      for(const asg of suitAssigns(sv.length)){
        const smap={};sv.forEach((v,i)=>smap[v]=asg[i]);
        const xV=xRef?DRAGS.filter(d=>d!==DRAGON[smap[xRef]]):[null];
        for(const n of nV)for(const m of mV){
          if(useN&&useM&&m===n)continue;
          for(const p of pV)for(const dd of dV)for(const xx of xV){
            const v=[];let good=true;
            for(const {k,sp} of toks){
              let tk=null,r;
              if(sp==='F')tk='F';
              else if(/^[NEWS]$/.test(sp))tk='W'+sp;
              else if(sp==='0')tk='G0';
              else if(sp==='DR')tk='GR';
              else if(sp==='DG')tk='GG';
              else if(sp==='DW')tk='G0';
              else if(sp==='dd')tk=dd;
              else if(r=/^d([abc])$/.exec(sp))tk=DRAGON[smap[r[1]]];
              else if(r=/^x([abc])$/.exec(sp))tk=xx;
              else if(r=/^([1-9])([abc])$/.exec(sp))tk=smap[r[2]]+r[1];
              else if(r=/^n([0-6]?)([abc])$/.exec(sp)){const num=n+ +(r[1]||0);if(num<1||num>9){good=false;break}tk=smap[r[2]]+num}
              else if(r=/^m([abc])$/.exec(sp))tk=smap[r[1]]+m;
              else if(r=/^p([abc])$/.exec(sp))tk=smap[r[1]]+p;
              if(!tk){good=false;break}
              v.push([tk,k]);
            }
            if(!good)continue;
            const kv=v.map(x=>x[0]+x[1]).sort().join('|');
            if(seen.has(kv)||variants.length>4000)continue;
            seen.add(kv);variants.push(v);
          }
        }
      }
    }
    if(!variants.length){
      fails.push({name:String(h.name||'Hand'),reason:failReason||'no valid arrangements produced'});
      continue;
    }
    hands.push({name:String(h.name||'Hand'),cat:String(h.cat||'CARD'),pts:+h.pts||25,
      concealed:!!h.c,note:String(h.note||''),disp:[[String(h.name||'Hand'),'cN']],variants});
  }
  return {title:String(cc.title||'MY CARD'),hands,fails};
}
async function unlockCard(code){
  const b=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(LOCKED_CARD.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(LOCKED_CARD.i)},key,b(LOCKED_CARD.c));
  return new TextDecoder().decode(pt);
}
function fileToJpeg(file,max=1568){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg',.9).split(',')[1]);
    };
    img.onerror=()=>rej(new Error('Could not read a photo'));
    img.src=URL.createObjectURL(file);
  });
}

function parseLoose(txt,arr){

  if(a<0||b<0)throw new Error('Could not understand the reading');
  return JSON.parse(txt.slice(a,b+1));
}
const IMGP=b64=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}});

const normText=s=>String(s||'').replace(/[^0-9A-Z]/gi,'').toUpperCase();
async function transcribePanel(file){
  const [full,top,bottom]=await Promise.all([
    fileToJpeg(file),cropHalf(file,0,.56),cropHalf(file,.44,1)]);
  async function readCrop(b64,which){
    const p=STAGE_A_PROMPT+`\n\nThis image is the ${which} portion of the panel. A row cut off at the image edge must still be included, with "partial":true added.`;
    const txt=await callAI([{type:'text',text:p},IMGP(b64)],true);
    return parseLoose(txt,true).filter(x=>x&&x.text);
  }
  const [tl,bl]=await Promise.all([readCrop(top,'TOP'),readCrop(bottom,'BOTTOM')]);
  const seen=new Set(),lines=[];
  for(const l of tl){if(l.partial)continue;const k=normText(l.text);if(!seen.has(k)){seen.add(k);lines.push(l)}}
  for(const l of bl){if(l.partial)continue;const k=normText(l.text);if(!seen.has(k)){seen.add(k);lines.push(l)}}
  if(!lines.length)throw new Error('Could not read the panel text');
  try{
    const vtxt=await callAI([{type:'text',text:VERIFY_PROMPT+JSON.stringify(lines)},IMGP(full)],true);
    const vlines=parseLoose(vtxt,true).filter(x=>x&&x.text);
    if(vlines.length>=lines.length*.7)return finish(vlines);
  }catch(e){}
  return finish(lines);
  function finish(ls){window.__reading=(window.__reading||[]).concat(ls);return ls}
}
async function convertLines(lines){
  let extra=null,best=null;
  for(let a=0;a<3;a++){
    const prompt=STAGE_B_HEAD+'\n\nINPUT LINES ('+lines.length+' hands — output exactly '+lines.length+' entries):\n'
      +JSON.stringify(lines)
      +(extra?'\n\nYOUR PREVIOUS ATTEMPT HAD PROBLEMS: '+extra+' — output the complete corrected JSON.':'');
    try{
      const cc=parseLoose(await callAI([{type:'text',text:prompt}],true),false);
      const r=expandCompact(cc);
      if(!best||r.hands.length>best.hands.length)best=r;
      const missing=lines.length-((cc.hands||[]).length);
      if(!r.fails.length&&missing<=0)return r;
      extra=(r.fails.length?'invalid hands: '+r.fails.map(f=>'"'+f.name+'" ('+f.reason+')').join('; '):'')
        +(missing>0?'; you output '+(lines.length-missing)+' of '+lines.length+' hands — every input line needs an entry':'');
    }catch(e){if(a===2&&!best)throw e;extra='previous output was not valid JSON in the required format'}
  }
  return best;
}

/* ---------- custom card ---------- */
function validateCard(c){
  if(!c||typeof c!=='object')return 'Not a card file';
  if(!Array.isArray(c.hands)||!c.hands.length)return 'No hands found';
  const rx=/^([CBD][1-9]|W[NEWS]|G[RG0]|F)$/;
  for(const h of c.hands){
    if(!Array.isArray(h.variants)||!h.variants.length)return 'A hand is missing its patterns';
    if(typeof h.pts!=='number')h.pts=25;
    h.concealed=!!h.concealed;
    h.name=h.name||'Hand';h.cat=h.cat||'CARD';h.note=h.note||'';
    if(!Array.isArray(h.disp))h.disp=[[h.name,'cN']];
    for(const v of h.variants){
      let sum=0;
      for(const g of v){
        if(!Array.isArray(g)||typeof g[0]!=='string'||!rx.test(g[0])||!(g[1]>=1&&g[1]<=6))
          return 'Bad tile group in "'+h.name+'"';
        sum+=g[1];
      }
      if(sum!==14)return 'A pattern in "'+h.name+'" does not total 14 tiles';
    }
  }
  return null;
}
function useCard(which){
  if(which==='custom'&&CUSTOM)HANDS=CUSTOM.hands;
  else{which='club';HANDS=CLUB_HANDS}
  try{localStorage.setItem('olmUse',which)}catch(e){}
}
function activeCardName(){return HANDS===CLUB_HANDS?'club':'custom'}
function bootCard(){
  try{
    const c=JSON.parse(localStorage.getItem('olmCard')||'null');
    if(c&&!validateCard(c))CUSTOM=c;
  }catch(e){}
  let pref='club';
  try{pref=localStorage.getItem('olmUse')||'club'}catch(e){}
  useCard(pref);
}
function saveCustomCard(text){
  let c;
  try{c=JSON.parse(text)}catch(e){return 'That is not valid card data'}
  const err=validateCard(c);
  if(err)return err;
  CUSTOM=c;
  try{localStorage.setItem('olmCard',JSON.stringify(c))}catch(e){return 'Could not save (storage unavailable)'}
  useCard('custom');
  return null;
}

/* ---------- validation ---------- */
function countsOf(tiles){
  const c={};let jk=0;
  for(const t of tiles){if(t.s==='J')jk++;else c[key(t)]=(c[key(t)]||0)+1}
  return {c,jk};
}
function tryVariant(counts,jokers,variant){
  const c=Object.assign({},counts);let jk=jokers;
  for(const [tk,k] of variant){
    if(k<=2){ if((c[tk]||0)<k)return false; c[tk]-=k; }
    else{ const have=Math.min(c[tk]||0,k); c[tk]-=have; const need=k-have;
      if(need>jk)return false; jk-=need; }
  }
  if(jk!==0)return false;
  for(const tk in c)if(c[tk]>0)return false;
  return true;
}
function allTiles(p){return p.hand.concat(...p.exp.map(e=>e.tiles))}
function expCount(p){return p.exp.reduce((s,e)=>s+e.tiles.length,0)}
function lockGroups(p,variant){
  if(!p.exp.length)return variant;
  const rem=variant.slice();
  for(const e of p.exp){
    const k=e.tiles.length,tk=e.rep;
    let f=-1;
    for(let i=0;i<rem.length;i++)if(rem[i][0]===tk&&rem[i][1]===k){f=i;break}
    if(f<0)return null;
    rem.splice(f,1);
  }
  return rem;
}
function checkWinTiles(tiles,hasExp){
  if(tiles.length!==14)return null;
  const {c,jk}=countsOf(tiles);
  for(const h of HANDS){
    if(h.concealed&&hasExp)continue;
    for(const v of h.variants) if(tryVariant(c,jk,v)) return {hand:h,variant:v};
  }
  return null;
}
function checkWinRack(p,rack){
  if(rack.length+expCount(p)!==14)return null;
  const {c,jk}=countsOf(rack);
  const hasExp=p.exp.length>0;
  for(const h of HANDS){
    if(h.concealed&&hasExp)continue;
    for(const v of h.variants){
      const rem=lockGroups(p,v);
      if(!rem)continue;
      if(tryVariant(c,jk,rem))return {hand:h,variant:v};
    }
  }
  return null;
}
function checkWin(p){return checkWinRack(p,p.hand)}
function checkWinWith(p,extra){return checkWinRack(p,p.hand.concat([extra]))}

/* fit scoring: best hand match for progress + bot AI */
function scoreVariant(counts,jk,variant){
  const c=Object.assign({},counts);
  let used=0,slots=0;
  for(const [tk,k] of variant){
    const have=Math.min(c[tk]||0,k); used+=have; c[tk]-=have;
    if(k>=3) slots+=k-have;
  }
  return used+Math.min(jk,slots);
}
function bestFit(p){
  const {c,jk}=countsOf(p.hand),hasExp=p.exp.length>0,ec=expCount(p);
  let best=null;
  for(const h of HANDS){
    if(h.concealed&&(hasExp||jk>0))continue;
    for(const v of h.variants){
      const rem=lockGroups(p,v);
      if(!rem)continue;
      const s=ec+scoreVariant(c,jk,rem);
      if(!best||s>best.score)best={hand:h,variant:v,rem,score:s};
    }
  }
  return best;
}
function keepIdsFor(p,variant){
  const keep=new Set(),taken={};
  for(const [tk,k] of variant)taken[tk]=(taken[tk]||0)+k;
  for(const t of p.hand){
    if(t.s==='J'){keep.add(t.id);continue}
    const tk=key(t);
    if((taken[tk]||0)>0){taken[tk]--;keep.add(t.id)}
  }
  return keep;
}
function handProgress(p){
  const {c,jk}=countsOf(p.hand),hasExp=p.exp.length>0,ec=expCount(p);
  return HANDS.map(h=>{
    if(h.concealed&&hasExp)return {h,score:0,dead:true};
    let s=-1;
    for(const v of h.variants){
      const rem=lockGroups(p,v);
      if(!rem)continue;
      const sc=ec+scoreVariant(c,jk,rem);
      if(sc>s)s=sc;
    }
    if(s<0)return {h,score:0,dead:true};
    return {h,score:s,dead:false};
  });
}

/* ---------- game state ---------- */
const BOTNAMES=['Evelyn','Dinah','Bitsy'];
let G=null,SEQ=0;
function later(ms,fn){const s=SEQ;setTimeout(()=>{if(s===SEQ&&G&&G.phase!=='over')fn()},ms)}

function newGame(){

/* ---------- charleston ---------- */
const CHDIR=['RIGHT','ACROSS','LEFT'];
function promptCharleston(){
  G.sel.clear();
  setStatus(`Charleston — choose 3 tiles to pass <b>${CHDIR[G.chStep].toLowerCase()}</b>`);
  renderRack();renderActions();
}
function botPassTiles(p){
  const bf=bestFit(p),keep=bf?keepIdsFor(p,bf.rem):new Set();
  let cand=p.hand.filter(t=>t.s!=='J'&&!keep.has(t.id));
  const extra=p.hand.filter(t=>t.s!=='J'&&keep.has(t.id));
  shuffle(cand);shuffle(extra);
  cand=cand.concat(extra);
  return cand.slice(0,3);
}
function doCharlestonPass(){
  if(G.sel.size!==3)return;
  if(MP.active){
    mpSend({type:'chpass',tiles:[...G.sel]});
    MP.chSubmitted=true;
    G.sel.clear();
    setStatus('Passed — waiting for the table…');
    renderActions();renderRack();
    return;
  }
  const passes=[];
  for(let i=0;i<4;i++){
    const p=G.players[i];
    let out;
    if(i===0){out=p.hand.filter(t=>G.sel.has(t.id))}
    else{out=botPassTiles(p)}
    p.hand=p.hand.filter(t=>!out.includes(t));
    passes.push(out);
  }
  const off=[1,2,3][G.chStep];
  for(let i=0;i<4;i++){
    G.players[(i+off)%4].hand.push(...passes[i]);
  }
  G.sel.clear();
  G.chStep++;
  renderAll();
  if(G.chStep<3){
    showMsg('PASS '+CHDIR[G.chStep]);
    promptCharleston();
  }else{
    startPlay();
  }
}
function startPlay(){
  G.phase='play';G.turn=G.dealer;G.step='discard';
  showMsg('GAME ON');
  setStatus(G.dealer===0?'You are East — discard to begin':`<b>${G.players[G.dealer].name}</b> is East`);
  renderAll();

}

/* ---------- turn flow ---------- */
function nextTurnFrom(i){
  G.turn=(i+1)%4;G.step='draw';
  renderAll();
  if(G.turn===0)later(500,playerDraw);
  else later(900,botAct);
}
function playerDraw(){
  if(!G.wall.length)return wallGame();
  const t=G.wall.pop();
  G.players[0].hand.push(t);
  G.step='discard';
  sfx('draw');

function playerDiscardPhase(){
  const me=G.players[0];
  G.winNow=checkWin(me);
  G.sel.clear();
  renderRack();renderActions();
  if(!G.winNow){
    if(me.exp.length&&!topFits(me).length)
      setStatus('Your turn — <b>hand is dead</b> (no card line fits your exposures). Discard safely.');
    else setStatus('Your turn — select a tile to discard');
  }
}
function findJokerSwap(){
  const me=G.players[0];
  for(const p of G.players)for(const e of p.exp){
    const j=e.tiles.find(t=>t.s==='J');
    if(!j)continue;
    const real=me.hand.find(t=>key(t)===e.rep);
    if(real)return {e,j,real};
  }
  return null;
}
function doJokerSwap(){
  const sw=findJokerSwap();if(!sw)return;
  const me=G.players[0];
  me.hand=me.hand.filter(t=>t!==sw.real);
  const idx=sw.e.tiles.indexOf(sw.j);
  sw.e.tiles[idx]=sw.real;
  me.hand.push(sw.j);
  sfx('joker');
  setStatus(`You swap <b>${nameOf(sw.real)}</b> for a <b>Joker</b>`);
  renderAll();
  playerDiscardPhase();
}
function discardSelected(){
  if(G.sel.size!==1)return;
  if(MP.active){
    mpSend({type:'discard',id:[...G.sel][0]});
    G.sel.clear();
    sfx('place');
    renderRack();renderActions();
    return;
  }
  const me=G.players[0];
  const t=me.hand.find(x=>G.sel.has(x.id));
  me.hand=me.hand.filter(x=>x!==t);
  G.sel.clear();
  G.discards.push({t,by:0});
  sfx('place');
  setStatus(`You discard <b>${nameOf(t)}</b>`);
  renderAll();
  afterDiscard(0,t);
}
function afterDiscard(by,t){
  if(t.s==='J'){later(700,()=>nextTurnFrom(by));return}
  if(by!==0){
    const me=G.players[0];
    const win=checkWinWith(me,t);
    const {c,jk}=countsOf(me.hand);
    const copies=c[key(t)]||0;
    const opts=[];
    if(win)opts.push({label:'MAH JONGG!',cls:'gold',fn:()=>playerCallWin(t,win)});
    const callable=copies>=2||(copies>=1&&jk>=1)||jk>=2;
    if(callable){
      for(const k of [3,4,5]){
        const need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
        if(jNeed<=jk&&copies+jk>=need&&(realUse+jNeed===need))
          opts.push({label:k===3?'PUNG':k===4?'KONG':'QUINT',cls:'',fn:()=>playerCallExpose(t,k)});
      }
    }
    if(opts.length){openCallBar(t,opts,()=>botClaims(by,t));return}
  }
  botClaims(by,t);
}
function botClaims(by,t){
  for(let j=1;j<4;j++){
    if(j===by)continue;
    const p=G.players[j];
    const win=checkWinWith(p,t);
    if(win){
      G.discards.pop();
      p.hand.push(t);
      declareWin(j,checkWin(p)||win);
      return;
    }
  }
  for(let j=1;j<4;j++){
    if(j===by)continue;
    const p=G.players[j];
    const bf=bestFit(p);
    if(!bf)continue;
    if(bf.hand.concealed)continue; /* never expose into a concealed-only hand */
    const grp=bf.rem.find(([tk,k])=>tk===key(t)&&k>=3);
    if(!grp)continue;
    const {c,jk}=countsOf(p.hand);
    const copies=c[key(t)]||0;
    if(copies<2)continue;
    const k=grp[1],need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
    if(jNeed>jk)continue;
    if(Math.random()<[0.7,0.9,1][BOTLVL]){
      G.discards.pop();
      const used=[];
      for(const x of p.hand){if(key(x)===key(t)&&used.length<realUse)used.push(x)}
      let jc=0;
      for(const x of p.hand){if(x.s==='J'&&jc<jNeed){used.push(x);jc++}}
      p.hand=p.hand.filter(x=>!used.includes(x));
      p.exp.push({tiles:[t,...used],rep:key(t)});
      G.turn=j;G.step='discard';
      sfx('call');
      setStatus(`<b>${p.name}</b> calls <b>${nameOf(t)}</b>!`);
      renderAll();
      later(1200,()=>botDiscard(p,j));
      return;
    }
  }
  nextTurnFrom(by);
}
function playerCallExpose(t,k){
  closeCall();
  const me=G.players[0];
  G.discards.pop();
  const {c}=countsOf(me.hand);
  const copies=c[key(t)]||0,need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
  const used=[];
  for(const x of me.hand){if(key(x)===key(t)&&used.filter(u=>u.s!=='J').length<realUse)used.push(x)}
  let jc=0;
  for(const x of me.hand){if(x.s==='J'&&jc<jNeed){used.push(x);jc++}}
  me.hand=me.hand.filter(x=>!used.includes(x));
  me.exp.push({tiles:[t,...used],rep:key(t)});
  G.turn=0;G.step='discard';
  setStatus(`You call <b>${nameOf(t)}</b> — now discard`);
  renderAll();
  playerDiscardPhase();
}
function playerCallWin(t,win){
  closeCall();
  G.discards.pop();
  G.players[0].hand.push(t);
  declareWin(0,win);
}
function botAct(){
  const j=G.turn,p=G.players[j];
  if(G.step==='draw'){
    if(!G.wall.length)return wallGame();
    p.hand.push(G.wall.pop());
    G.step='discard';
    setStatus(`<b>${p.name}</b> draws…`);
    renderAll();
    const win=checkWin(p);
    if(win){later(900,()=>declareWin(j,win));return}
    later(850,()=>botDiscard(p,j));
  }else{
    const win=checkWin(p);

/* bot difficulty: 0 breezy, 1 club player (default), 2 shark */
let BOTLVL=1;try{BOTLVL=Math.min(2,Math.max(0,parseInt(localStorage.getItem('olmBots'))||1))}catch(e){}
const BOTLVL_NAMES=['BREEZY','CLUB PLAYER','SHARK'];
const BOT_DESCS=['forgiving table, generous discards','plays a solid game, misses a little','defends, never misses a call'];
function visibleCounts(){
  const v={};
  for(const d of G.discards){const k=key(d.t);v[k]=(v[k]||0)+1}
  for(const p of G.players)for(const e of p.exp)for(const t of e.tiles){if(t.s!=='J'){const k=key(t);v[k]=(v[k]||0)+1}}
  return v;
}
/* score = danger×D − optionValue; discard the LOWEST scorer.
   Uses only table-visible information — no peeking at hidden racks. */
function botScoreDiscard(p,j,cand){
  const D=[0.25,1,2][BOTLVL];
  const vis=visibleCounts();
  const fits=topFits(p);
  const alt1=fits[1]?keepIdsFor(p,fits[1].rem):new Set();
  const alt2=fits[2]?keepIdsFor(p,fits[2].rem):new Set();
  const late=G.wall.length<15?2:G.wall.length<30?1.5:1;
  let best=null,bestScore=Infinity;
  for(const t of cand){
    const tk=key(t);
    const mine=p.hand.filter(x=>key(x)===tk).length;
    const outstanding=Math.max(0,(t.s==='F'?8:4)-(vis[tk]||0)-mine);
    const liveMult=outstanding<=0?0.05:outstanding===1?0.45:1;
    let danger=0.4;
    for(let q=0;q<4;q++){
      if(q===j)continue;
      for(const e of G.players[q].exp){
        const rs=e.rep[0],rn=parseInt(e.rep.slice(1));
        if(t.s==='F'){if(rs==='F')danger+=0.8;continue}
        if(t.s==='W'||t.s==='G'){if(rs==='W'||rs==='G')danger+=0.5;continue}
        if(rs===t.s&&!isNaN(rn)&&Math.abs(rn-t.n)<=2)danger+=1.2;
        else if(!isNaN(rn)&&rn===t.n&&'CBD'.includes(rs))danger+=0.8;
      }
    }
    danger*=liveMult*late;
    let opt=0;
    if(alt1.has(t.id))opt+=0.8;
    if(alt2.has(t.id))opt+=0.4;
    const s=D*danger-opt+Math.random()*0.15;
    if(s<bestScore){bestScore=s;best=t}
  }
  return best||cand[0];
}
function botDiscard(p,j){
  const bf=bestFit(p),keep=bf?keepIdsFor(p,bf.rem):new Set();
  let cand=p.hand.filter(t=>t.s!=='J'&&!keep.has(t.id));
  if(!cand.length)cand=p.hand.filter(t=>t.s!=='J');
  if(!cand.length)cand=[...p.hand];
  const t=botScoreDiscard(p,j,cand);
  p.hand=p.hand.filter(x=>x!==t);
  G.discards.push({t,by:j});
  sfx('placebot');
  setStatus(`<b>${p.name}</b> discards <b>${nameOf(t)}</b>`);
  renderAll();
  later(600,()=>afterDiscard(j,t));
}

let AC=null;

function olmHaptic(kind){

    const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;

function sfx(kind){
  if(kind==='tap'||kind==='place'||kind==='call'||kind==='win'||kind==='joker')olmHaptic(kind);
  if(!SND)return;
  const a=ac();if(!a)return;
  const t=a.currentTime;
  const tone=(f,st,d,v,ty)=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type=ty||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t+st);
    g.gain.linearRampToValueAtTime(v,t+st+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+st+d);
    o.connect(g);g.connect(a.destination);
    o.start(t+st);o.stop(t+st+d+.03);
  };
  const click=(st,v,fc,dur)=>{
    dur=dur||.03;
    const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate);
    const dt=b.getChannelData(0);
    for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/dt.length,2.4);
    const s=a.createBufferSource();s.buffer=b;
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=1.3;
    const g=a.createGain();g.gain.value=v;
    s.connect(f);f.connect(g);g.connect(a.destination);
    s.start(t+st);
  };
  if(kind==='tap'){click(0,.4,2200);tone(1850,.001,.04,.035)}
  else if(kind==='place'){click(0,.55,1150);tone(230,.002,.06,.045,'triangle')}
  else if(kind==='placebot'){click(0,.28,1050);tone(210,.002,.05,.02,'triangle')}
  else if(kind==='draw'){click(0,.22,2900)}
  else if(kind==='shuffle'){for(let i=0;i<6;i++)click(i*.032+Math.random()*.012,.2,1300+Math.random()*1000)}
  else if(kind==='call'){click(0,.5,950);click(.1,.5,950)}
  else if(kind==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{tone(f,i*.095,.5,.1);tone(f*2,i*.095,.25,.02)})}
  else if(kind==='lose'){tone(392,.0,.22,.05,'triangle');tone(311,.16,.3,.05,'triangle')}
  else if(kind==='joker'){tone(659,.0,.09,.055);tone(880,.09,.14,.055)}
}

function buildDebrief(){
  try{
    const me=G&&G.players&&G.players[0];
    if(!me||!me.hand||!me.hand.length)return null;
    const fits=topFits(me);
    if(!fits.length)return null;
    const {c}=countsOf(me.hand);
    const jk=me.hand.filter(t=>t.s==='J').length;
    const items=fits.slice(0,2).map(bf=>{
      const missing=[];
      for(const [tk,k] of bf.rem){
        const have=Math.min(c[tk]||0,k);
        for(let x=0;x<k-have;x++)missing.push(tk);
      }
      return {name:bf.hand.name,cat:bf.hand.cat,pts:bf.hand.pts,disp:bf.hand.disp,conc:bf.hand.concealed,
        away:Math.max(0,14-bf.score),desc:describeVariant(bf.variant),
        missing:missing.slice(0,8),missAll:missing};

    for(const tk of items[0].missAll)needSet[tk]=(needSet[tk]||0)+1;
    let nth=0;
    for(const d of (G.discards||[])){
      if(d.by!==0)continue;
      nth++;
      const tk=key(d.t);

/* swipe-down to dismiss the sheet — only where dismissing is safe */
(function(){
  const mi=$('modalin');
  let sy=0,dy=0,drag=false;
  const softClose=()=>{
    const b=mi.querySelector('#mclose')||mi.querySelector('#impcancel')||mi.querySelector('#wclub');
    if(b)b.click();else closeModal();
  };
  const dismissible=()=>!MP.active&&!mi.querySelector('#revsave')&&!mi.querySelector('#convmsg');
  mi.addEventListener('touchstart',e=>{
    if(e.target.closest&&e.target.closest('input,textarea,select,button,details'))return;
    if(!dismissible()||mi.scrollTop>4)return;
    sy=e.touches[0].clientY;dy=0;drag=true;
    mi.style.animation='none';mi.style.transition='none';
  },{passive:true});
  mi.addEventListener('touchmove',e=>{
    if(!drag)return;
    dy=e.touches[0].clientY-sy;

    e.preventDefault();
    mi.style.transform='translateY('+dy+'px)';
  },{passive:false});
  const finish=()=>{
    if(!drag)return;drag=false;
    mi.style.transition='transform .26s cubic-bezier(.3,.9,.4,1)';
    if(dy>90){
      mi.style.transform='translateY(115%)';
      setTimeout(()=>{softClose();mi.style.transform='';mi.style.transition='';mi.style.animation=''},210);
    }else{
      mi.style.transform='translateY(0)';
      setTimeout(()=>{mi.style.transform='';mi.style.transition='';mi.style.animation=''},280);

  };
  mi.addEventListener('touchend',finish);

})();

function callAdvice(t){

function topFits(p){

  const list=[];
  for(const h of HANDS){
    if(h.concealed&&(hasExp||jk>0))continue;

      const rem=lockGroups(p,v);

function rackPointer(e,t,td){
  if(!G||G.phase==='over')return;
  if(e.isPrimary===false)return;
  killClones();
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;let clone=null;
  const move=ev=>{
    if(ev.isPrimary===false)return;
    if(!DRAG&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){
      DRAG=true;DRAGT=Date.now();
      clone=td.cloneNode(true);
      clone.classList.remove('sel');
      clone.classList.add('dragclone');
      clone.style.cssText='position:fixed;z-index:999;pointer-events:none;margin:0;width:'+td.offsetWidth+'px;height:'+td.offsetHeight+'px;opacity:.95;transform:scale(1.12);transition:none';
      document.body.appendChild(clone);

    }
    if(DRAG&&clone){
      clone.style.left=(ev.clientX-td.offsetWidth/2)+'px';
      clone.style.top=(ev.clientY-td.offsetHeight*.9)+'px';
    }
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    if(DRAG){
      killClones();
      td.style.opacity='';

      const kids=[...$('rack').children];
      let best=-1,bd=Infinity;
      kids.forEach((k,i)=>{
        const r=k.getBoundingClientRect();
        const d=Math.pow(ev.clientX-(r.left+r.width/2),2)+Math.pow(ev.clientY-(r.top+r.height/2),2);
        if(d<bd){bd=d;best=i}
      });
      if(best>=0){
        const r=kids[best].getBoundingClientRect();
        let target=best+(ev.clientX>r.left+r.width/2?1:0);
        const old=me.hand.indexOf(t);
        if(old>=0){
          me.hand.splice(old,1);
          if(target>old)target--;
          if(target<0)target=0;
          if(target>me.hand.length)target=me.hand.length;
          me.hand.splice(target,0,t);
        }
      }
      if(MP.active)MP.orderIds=G.players[0].hand.map(x=>x.id);
      renderRack();
    }else{

    }
  };

  window.addEventListener('pointerup',up);

    sfx('tap');

  }else if(G.phase==='play'&&G.turn===0&&G.step==='discard'){
    if(G.sel.has(t.id))G.sel.delete(t.id);
    else{G.sel.clear();G.sel.add(t.id)}
    sfx('tap');
    renderRack();renderActions();
  }
}
function renderActions(){
  const box=$('actions');box.innerHTML='';

    const b=document.createElement('button');
    b.className='abtn '+cls;b.innerHTML=label;b.onclick=fn;b.disabled=!!dis;
    box.appendChild(b);return b;
  };
  if(G.phase==='charleston'){
    if(MP.active&&MP.chSubmitted){mk('PASSED ✓','ghost',()=>{},true)}

  }else if(G.phase==='play'&&G.turn===0&&G.step==='discard'){
    if(MP.active){
      if(G.winNow)mk('MAH JONGG!','gold',()=>mpSend({type:'mahjong'}));
      if(MP.swaps&&MP.swaps.length)mk('SWAP JOKER','ghost',()=>mpSend({type:'swap',seat:MP.swaps[0].seat,exp:MP.swaps[0].exp}));
      mk('DISCARD','',discardSelected,G.sel.size!==1);

      if(findJokerSwap())mk('SWAP JOKER','ghost',doJokerSwap);

  }

/* background reading: the user plays on while the server reads their photos */
let BGREAD={timer:null};
let READERR=null;
function readInProgress(){try{return JSON.parse(localStorage.getItem('olmReadJob')||'null')}catch(e){return null}}
function bgReadClear(){clearTimeout(BGREAD.timer);BGREAD.timer=null;try{localStorage.removeItem('olmReadJob')}catch(e){}}
async function bgReadPoll(job){
  clearTimeout(BGREAD.timer);
  try{
    const r=await fetch(olmHttp()+'/api/readjob?id='+job+'&t='+Date.now());
    const j=await r.json();
    if(j.status==='done'&&j.result&&j.result.card&&!validateCard(j.result.card)){
      bgReadClear();
      try{localStorage.setItem('olmPendingCard',JSON.stringify({card:j.result.card,flags:j.result.flags||[],panels:j.result.panels||[],model:j.result.model||'?'}))}catch(e){}
      showMsg('YOUR CARD IS READY');
      maybeOfferPendingCard();
      return;
    }
    if(j.status==='error'||j.err){
      bgReadClear();
      READERR=(j.result&&j.result.error)||j.err||'The reading failed — try again with brighter, flatter photos.';
      showMsg('CARD READ FAILED');
      return;
    }
  }catch(e){}
  BGREAD.timer=setTimeout(()=>bgReadPoll(job),10000);
}
function maybeOfferPendingCard(force){
  let p=null;try{p=JSON.parse(localStorage.getItem('olmPendingCard')||'null')}catch(e){}
  if(!p)return false;
  const titleVisible=!$('title').classList.contains('hide');
  const inGame=!titleVisible&&G&&G.phase&&G.phase!=='over';
  if(inGame&&!force)return false;
  try{localStorage.removeItem('olmPendingCard')}catch(e){}
  window.__reading=p.panels;window.__modelUsed=p.model;
  reviewCard(p.card,p.flags,false);
  return true;
}

const MP={ws:null,active:false,view:null,token:null,name:'',retry:0,intended:false};
function mpToken(){
  if(MP.token)return MP.token;
  try{
    let t=localStorage.getItem('olmTok');
    if(!t){t='t'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('olmTok',t)}
    MP.token=t;
  }catch(e){MP.token='t'+Math.random().toString(36).slice(2)}
  return MP.token;
}
function mpName(){
  try{return localStorage.getItem('olmName')||''}catch(e){return ''}
}
function mpSend(m){if(MP.ws&&MP.ws.readyState===1)MP.ws.send(JSON.stringify(m))}
function mpConnect(then){
  if(MP.ws&&MP.ws.readyState===1){if(then)then();return}
  const ws=new WebSocket(OLM_SERVER+'?t='+encodeURIComponent(mpToken()));
  MP.ws=ws;
  ws.onopen=()=>{MP.retry=0;mpSend({type:'hello',name:MP.name});if(then)then()};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}mpOnMsg(m)};
  ws.onclose=()=>{
    if(MP.intended&&MP.retry<8){
      MP.retry++;
      setStatus('Reconnecting…');
      setTimeout(()=>mpConnect(),Math.min(500*Math.pow(2,MP.retry),8000));
    }
  };
}
function mpOnMsg(m){
  switch(m.type){
    case 'view':{
      if(!MP.intended)return;
      MP.view=m;
      if(m.phase==='lobby')renderLobby(m);
      else{closeModal();mpRenderGame(m)}
      break;
    }
    case 'callwin':{
      if(!MP.intended)return;
      mpShowCallBar(m);
      break;
    }
    case 'event':{
      if(m.kind==='discard'&&MP.view){stFlash(`<b>${seatName(m.seat)}</b> discards`);if(MP.view.you&&m.seat!==MP.view.you.seat)sfx('placebot')}
      if(m.kind==='charleston'){showMsg('PASS '+['RIGHT','ACROSS','LEFT'][m.step]);sfx('shuffle')}
      if(m.kind==='start'){showMsg('THE CHARLESTON');sfx('shuffle')}
      if(m.kind==='gameon'){showMsg('GAME ON');sfx('shuffle')}
      if(m.kind==='call'){stFlash(`<b>${seatName(m.seat)}</b> calls!`);sfx('call')}
      if(m.kind==='botsub')stFlash(`<b>${seatName(m.seat)}</b> lost connection — a bot fills in`);
      if(m.kind==='rejoin')stFlash(`<b>${seatName(m.seat)}</b> is back`);
      if(m.kind==='takeover'){stFlash(`<b>${m.name}</b> joins the table!`);showMsg(m.name.toUpperCase()+' JOINS')}
      break;
    }
    case 'end':{if(!MP.intended)return;mpShowEnd(m);break}
    case 'err':{setStatus(m.msg||'Hmm, that did not work');if(MP.view&&MP.view.phase==='lobby')renderLobby(MP.view);else if(!MP.view){closeModal();openFriends(m.msg)}break}
    case 'left':{MP.active=false;MP.intended=false;MP.view=null;goTitle();break}
  }
}
function seatName(i){return MP.view&&MP.view.seats[i]?MP.view.seats[i].name:'Seat '+(i+1)}
function hintsAllowed(){return !MP.active||!MP.view||!MP.view.config||MP.view.config.hints!==false}
function stFlash(h){setStatus(h);MP.stHold=Date.now()}
/* fake-G so the existing renderers draw server views */
function mpRenderGame(v){
  MP.active=true;
  $('title').classList.add('hide');
  const meIdx=v.you.seat;
  let myRack=v.you.rack;
  if(MP.orderIds&&MP.orderIds.length){
    const pos=new Map(MP.orderIds.map((id,ix)=>[id,ix]));
    myRack=myRack.slice().sort((a,b)=>(pos.has(a.id)?pos.get(a.id):999)-(pos.has(b.id)?pos.get(b.id):999));
  }
  v=Object.assign({},v,{you:Object.assign({},v.you,{rack:myRack})});
  const players=[];
  for(let d=0;d<4;d++){
    const i=(meIdx+d)%4,s=v.seats[i];
    players.push({
      name:s.isYou?'You':s.name+(s.botSub?' 🤖':''),isBot:s.kind==='bot',
      hand:s.isYou?v.you.rack:Array.from({length:s.count},()=>({s:'X'})),
      exp:s.exp.map(e=>({tiles:e.tiles,rep:e.rep})),
    });
  }
  G={phase:v.phase==='charleston'?'charleston':'play',
     chStep:v.chStep,wall:{length:v.wall},
     players,dealer:(v.dealer-meIdx+4)%4,
     turn:(v.turn-meIdx+4)%4,step:v.step,
     discards:v.discards.map(d=>({t:d.t,by:(d.by-meIdx+4)%4})),
     sel:G&&MP.lastSeat===meIdx?G.sel:new Set(),winNow:null};
  MP.lastSeat=meIdx;
  G.winNow=v.you.canMahjong?{mp:true}:null;
  MP.swaps=v.you.swaps||[];
  MP.chSubmitted=v.you.chSubmitted;
  renderAll();
  if(v.phase==='charleston'){
    setStatus(MP.chSubmitted?'Passed — waiting for the table…':`Charleston — choose 3 tiles to pass <b>${['right','across','left'][v.chStep]}</b>`);
  }else if(v.phase==='play'){
    const myExpTiles=v.seats[meIdx].exp.reduce((s,e)=>s+e.tiles.length,0);

function describeVariant(v){
  const SN={C:'Craks',B:'Bams',D:'Dots'};
  const DN={GR:'Red',GG:'Green',G0:'Soap'};
  const order=[],suitG={},other=[];
  let fl=0;
  for(const [tk,k] of v){
    if(tk==='F'){fl+=k;continue}
    const s=tk[0];
    if(s==='C'||s==='B'||s==='D'){
      if(!suitG[s]){suitG[s]=[];order.push(s)}
      suitG[s].push([+tk.slice(1),k]);
    }else if(s==='W'){
      other.push(tk[1].repeat(k));
    }else{
      other.push((tk==='G0'?'0':'D').repeat(k)+' '+DN[tk]);
    }
  }
  const parts=[];
  if(fl)parts.push('F'.repeat(fl));
  for(const s of order){
    suitG[s].sort((a,b)=>a[0]-b[0]);
    parts.push(suitG[s].map(([n,k])=>String(n).repeat(k)).join(' ')+' '+SN[s]);
  }
  if(other.length)parts.push(other.join(' '));
  return parts.join(' · ');
}

  bd.style.backgroundImage=`url("${uri}")`;
  bd.style.backgroundSize='cover';bd.style.backgroundPosition='center';
  $('titlemural').style.backgroundImage=`url("${uri}")`;
  $('btnmat').style.background=`conic-gradient(${th.bg1} 0 33%, ${th.blossom} 33% 66%, ${th.branch} 66% 100%)`;
  document.querySelector('meta[name=theme-color]').setAttribute('content',th.bg2);
  document.querySelectorAll('.matsw').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('matname').textContent=th.name;
}
(function buildMatRow(){
  const row=$('matrow');
  THEMES.forEach((th,i)=>{
    const b=document.createElement('button');
    b.className='matsw';
    b.style.background=`linear-gradient(140deg, ${th.bg1} 30%, ${th.blossom} 100%)`;
    b.onclick=()=>applyMat(i);
    row.appendChild(b);
  });
})();
$('btnmat').onclick=()=>applyMat((MAT+1)%THEMES.length);
applyMat(0);
bootCard();
(function(){
  let seen=false;
  try{seen=!!localStorage.getItem('olmSeen')}catch(e){}
  if(!seen&&!CUSTOM)showWelcome();
  else{try{localStorage.setItem('olmSeen','1')}catch(e){}}
  const rj=readInProgress();
  if(rj)bgReadPoll(rj.job);
  setTimeout(()=>maybeOfferPendingCard(),600);
})();
</script>
</body>

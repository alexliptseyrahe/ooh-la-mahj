<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C3B2E">
<title>Ooh La Mahj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#11594400; /* placeholder */
  --deep:#0C3B2E;
  --deep2:#0F4A39;
  --emerald:#156146;
  --emerald-lt:#1E7A58;
  --ivory:#FBF7EC;
  --cream:#F3EBD8;
  --gold:#C9A24B;
  --gold-dk:#A5822F;
  --gold-pale:#E8D9AE;
  --coral:#E2725B;
  --coral-dk:#C85B45;
  --pink:#F2C9BC;
  --ink:#22332B;
  --red:#B23A2F;
  --grn:#1B6B4C;
  --blu:#2C5F82;
  --tile-face:#FFFDF4;
  --tile-face2:#F5EEDB;
  --tile-edge:#E0D6B8;
  --shadow:0 2px 5px rgba(10,25,18,.35);
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Jost', 'Avenir Next', -apple-system, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{--bg1:#14523F;--bg2:#0C3B2E;--bg3:#082E23}
body{
  font-family:var(--sans);
  color:var(--ivory);
  background-color:var(--deep);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,.028) 16px 17px),
    repeating-linear-gradient(-45deg, transparent 0 16px, rgba(255,255,255,.028) 16px 17px),
    radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  transition:background-color .4s;
  display:flex;flex-direction:column;
  height:100dvh;
  user-select:none;-webkit-user-select:none;
}
button{font-family:var(--sans);border:none;cursor:pointer;background:none;color:inherit}

/* ---------- generic tile ---------- */
.tile{
  position:relative;flex:none;
  background:linear-gradient(165deg,var(--tile-face) 0%,var(--tile-face) 55%,var(--tile-face2) 100%);
  border:1px solid var(--tile-edge);
  border-radius:8px;
  box-shadow:var(--shadow), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(160,140,90,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink);
  overflow:hidden;
  transition:transform .14s ease, box-shadow .14s ease;
}
.tile .n{font-family:var(--serif);font-weight:700;line-height:.9}
.tile .m{line-height:1;display:flex;align-items:center;justify-content:center}
.tile .lbl{font-family:var(--sans);font-weight:600;letter-spacing:.14em;line-height:1}
.tile.red .n{color:var(--red)} .tile.grn .n{color:var(--grn)} .tile.blu .n{color:var(--blu)}
.tile.back{background:linear-gradient(160deg,#17604A,#0F4A39);border-color:#0A2E24}
.tile.back::after{content:'';position:absolute;inset:3px;border:1px solid rgba(201,162,75,.55);border-radius:5px;
  background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(201,162,75,.13) 5px 6px)}

/* rack size */
.t-lg{width:min(12.2vw,52px);aspect-ratio:13/17}
.t-lg .n{font-size:clamp(19px,6vw,26px)}
.t-lg .m svg{width:clamp(12px,3.8vw,16px);height:clamp(12px,3.8vw,16px)}
.t-lg .m .zi{font-size:clamp(11px,3.4vw,14px)}
.t-lg .lbl{font-size:7px;margin-top:2px}
/* mid (exposures, win display) */
.t-md{width:34px;aspect-ratio:13/17;border-radius:6px}
.t-md .n{font-size:17px}
.t-md .m svg{width:10px;height:10px}
.t-md .m .zi{font-size:9px}
.t-md .lbl{font-size:5px;margin-top:1px}
/* small (discards) */
.t-sm{width:29px;aspect-ratio:13/17;border-radius:5px}
.t-sm .n{font-size:15px}
.t-sm .m svg{width:9px;height:9px}
.t-sm .m .zi{font-size:8px}
.t-sm .lbl{font-size:4.5px;margin-top:1px}
/* tiny (opponent exposures) */
.t-xs{width:20px;aspect-ratio:13/17;border-radius:4px;box-shadow:0 1px 2px rgba(10,25,18,.3)}
.t-xs .n{font-size:10px}
.t-xs .m svg{width:6px;height:6px}
.t-xs .m .zi{font-size:5.5px}
.t-xs .lbl{font-size:3.5px}

.tile.joker{background:linear-gradient(165deg,#125441,#0D4232);border-color:#0A2E24;color:var(--gold-pale)}
.tile.joker .lbl{color:var(--gold);letter-spacing:.16em}
.tile.sel{transform:translateY(-9px);box-shadow:0 8px 14px rgba(10,25,18,.5),0 0 0 2px var(--coral), inset 0 1.5px 0 rgba(255,255,255,.9)}
.tile.just{outline:2px solid var(--coral);outline-offset:1px}

/* ---------- layout ---------- */
#hdr{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top, 8px) + 6px) 14px 8px;
}
#hdr .brand{font-family:var(--serif);font-weight:600;letter-spacing:.22em;font-size:13px;color:var(--gold-pale)}
#hdr .brand b{color:var(--gold);font-weight:700}
#wallct{font-size:11px;letter-spacing:.12em;color:rgba(251,247,236,.75)}
#wallct b{color:var(--gold);font-weight:600}
#hdr .hbtn{font-size:10px;letter-spacing:.12em;color:var(--gold-pale);border:1px solid rgba(201,162,75,.5);border-radius:14px;padding:4px 9px}

#opps{flex:none;display:flex;gap:8px;padding:2px 10px 6px}
.opp{
  flex:1;background:rgba(8,40,30,.5);border:1px solid rgba(201,162,75,.25);border-radius:12px;
  padding:6px 8px 7px;display:flex;flex-direction:column;gap:4px;min-width:0;
  transition:border-color .2s, box-shadow .2s;
}
.opp .oname{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;color:var(--ivory)}
.opp .dotad{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.opp.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,162,75,.5),0 0 14px rgba(201,162,75,.25)}
.opp.active .dotad{background:var(--coral);box-shadow:0 0 6px var(--coral)}
.opp .octr{font-size:9.5px;color:rgba(251,247,236,.55);letter-spacing:.1em}
.opp .oexp{display:flex;gap:2px;flex-wrap:wrap;min-height:0}

#board{
  flex:1;min-height:0;margin:2px 10px;display:flex;flex-direction:column;
  background:rgba(6,32,24,.35);
  border:1px solid rgba(201,162,75,.28);border-radius:16px;
  position:relative;overflow:hidden;
}
#board .btitle{flex:none;text-align:center;font-size:9.5px;letter-spacing:.3em;color:rgba(232,217,174,.6);padding:7px 0 2px}
#discards{
  flex:1;overflow-y:auto;padding:6px 10px 10px;
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;
}
#tablemsg{
  position:absolute;inset:auto 0 0 0;top:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;text-align:center;padding:0 30px;
}
#tablemsg span{
  font-family:var(--serif);font-size:19px;font-weight:600;color:var(--gold-pale);
  text-shadow:0 2px 8px rgba(0,0,0,.5);line-height:1.3;
}

#me{flex:none;padding:4px 8px calc(env(safe-area-inset-bottom, 10px) + 8px)}
#myexp{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;padding:2px 0 5px;min-height:0}
#myexp .egrp{display:flex;gap:2px;background:rgba(8,40,30,.5);border:1px solid rgba(201,162,75,.3);border-radius:8px;padding:3px 4px}
#rack{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 0 2px}
#rack .tile{touch-action:none}
.tile.hint{box-shadow:0 2px 5px rgba(10,25,18,.35),0 0 0 2px var(--gold),0 0 12px rgba(201,162,75,.65), inset 0 1.5px 0 rgba(255,255,255,.9)}
.tile.dim{opacity:.5}
#rackbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:2px 6px 0}
.mini{font-size:9.5px;letter-spacing:.18em;color:var(--gold-pale);border:1px solid rgba(201,162,75,.45);border-radius:12px;padding:4px 11px}
.mini.on{background:rgba(201,162,75,.3);color:#fff;border-color:var(--gold)}
#actions{
  display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;
  min-height:46px;padding-top:6px;
}
.abtn{
  font-size:13px;font-weight:600;letter-spacing:.14em;
  padding:11px 22px;border-radius:24px;color:#fff;
  background:linear-gradient(160deg,var(--coral),var(--coral-dk));
  box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.abtn:active{transform:translateY(1px)}
.abtn.gold{background:linear-gradient(160deg,var(--gold),var(--gold-dk));color:#241C08}
.abtn.ghost{background:none;border:1px solid rgba(251,247,236,.45);box-shadow:none;color:var(--ivory);font-weight:500}
.abtn.big{font-size:15px;padding:13px 30px}
.abtn:disabled{opacity:.4;pointer-events:none}
#statusline{text-align:center;font-size:12px;letter-spacing:.1em;color:rgba(251,247,236,.8);min-height:16px;padding-top:2px}
#statusline b{color:var(--gold)}

/* ---------- title screen ---------- */
#title{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background-color:var(--deep);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,.03) 16px 17px),
    repeating-linear-gradient(-45deg, transparent 0 16px, rgba(255,255,255,.03) 16px 17px),
    radial-gradient(130% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  transition:opacity .5s;text-align:center;padding:30px;
}
#title.hide{opacity:0;pointer-events:none}
#titlemural{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#title>*:not(#titlemural){position:relative;z-index:1}
.matrow{display:flex;gap:14px;margin-top:30px;align-items:center}
.matsw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:all .2s}
.matsw.on{border-color:var(--gold);box-shadow:0 0 12px rgba(201,162,75,.55);transform:scale(1.12)}
#matname{font-size:9.5px;letter-spacing:.32em;color:rgba(232,217,174,.7);margin-top:10px}
#matlabel{font-size:9px;letter-spacing:.3em;color:rgba(251,247,236,.5);margin-top:26px}
#btnmat{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(201,162,75,.6);margin-right:8px}
.crest{
  width:150px;height:150px;border-radius:50%;
  border:1.5px solid var(--gold);position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:26px;
  box-shadow:0 0 40px rgba(201,162,75,.15), inset 0 0 30px rgba(201,162,75,.08);
}
.crest::before{content:'';position:absolute;inset:7px;border:1px solid rgba(201,162,75,.55);border-radius:50%}
.crest svg{width:74px;height:74px}
#title h1{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.3em;margin-left:.3em;color:var(--ivory);line-height:1.15}
#title h2{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.5em;margin:6px 0 2px .5em;color:var(--gold)}
#title .est{font-size:10px;letter-spacing:.4em;color:rgba(232,217,174,.65);margin:14px 0 34px}
#title .est::before,#title .est::after{content:'—';margin:0 10px;color:rgba(201,162,75,.5)}
#title .tbtns{display:flex;flex-direction:column;gap:14px;align-items:center}

/* ---------- card sheet ---------- */
#sheet{
  position:fixed;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;
  background:rgba(5,20,15,.55);backdrop-filter:blur(3px);
}
#sheet.open{display:flex}
#sheetin{
  background:var(--ivory);color:var(--ink);border-radius:20px 20px 0 0;
  max-height:82dvh;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.4);
}
#sheetin .grab{flex:none;width:44px;height:4px;border-radius:2px;background:#CBBF9E;margin:10px auto 4px}
#sheetin h3{
  font-family:var(--serif);font-weight:700;text-align:center;font-size:19px;letter-spacing:.18em;color:var(--deep);
  padding:4px 0 2px;
}
#sheetin .sub{text-align:center;font-size:10px;letter-spacing:.22em;color:#8A7F5F;padding-bottom:8px;border-bottom:1px solid #E2D8BC}
#cardlist{overflow-y:auto;padding:10px 16px calc(env(safe-area-inset-bottom,10px) + 16px)}
#cardctl{display:flex;gap:6px;justify-content:center;padding:9px 0 2px}
.cbtn{font-size:10px;font-weight:600;letter-spacing:.16em;color:#6B6248;border:1px solid #CBBF9E;border-radius:13px;padding:5px 13px;background:#fff}
.cbtn.on{background:var(--deep);color:var(--gold-pale);border-color:var(--deep)}
.cbtn.imp{color:var(--coral-dk);border-color:var(--coral)}
.cbtn:disabled{opacity:.35}
#imparea{width:100%;height:90px;border:1px solid #CBBF9E;border-radius:10px;padding:8px;font-size:11px;font-family:monospace;margin:8px 0;resize:none;background:#FDFBF4;color:var(--ink)}
#impfile{font-size:12px;margin:2px 0 6px;max-width:100%}
.imperr{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
.photozone{border:2px dashed #CBBF9E;border-radius:14px;padding:18px 12px;text-align:center;margin:12px 0;background:#FDFBF4}
.photozone .pz1{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--deep)}
.photozone .pz2{font-size:12px;color:#8A7F5F;margin:6px 0 12px;line-height:1.5}
.pslots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.pslot{width:88px;height:66px;border:1.5px dashed #CBBF9E;border-radius:10px;background:#FFFDF4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden;position:relative;padding:0}
.pslot span{font-size:9px;letter-spacing:.14em;color:#8A7F5F;font-weight:600}
.pslot b{font-size:17px;color:var(--coral-dk);line-height:1}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot.filled{border-style:solid;border-color:var(--grn)}
.pslot.filled::after{content:'✓';position:absolute;top:2px;right:5px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)}
details.altimp{margin-top:12px;text-align:left}
details.altimp summary{font-size:11px;letter-spacing:.08em;color:#8A7F5F;cursor:pointer}
.spin{width:34px;height:34px;border:3px solid #E2D8BC;border-top-color:var(--coral);border-radius:50%;margin:14px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.revlist{max-height:200px;overflow-y:auto;text-align:left;border:1px solid #E2D8BC;border-radius:10px;padding:8px 10px;margin:10px 0;font-size:12px;line-height:1.7;color:#3E4E45}
.revlist b{color:var(--deep)}
.revcat{font-size:10px;letter-spacing:.2em;color:var(--gold-dk);margin-top:6px}
.ccat{font-size:10.5px;font-weight:600;letter-spacing:.26em;color:var(--gold-dk);margin:14px 0 6px}
.chand{
  background:#fff;border:1px solid #E6DCC0;border-radius:12px;padding:10px 12px;margin-bottom:8px;
  display:flex;flex-direction:column;gap:6px;
}
.chand.best{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}
.chand .chtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chand .chname{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--deep)}
.chand .chpts{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--gold-dk);white-space:nowrap}
.chand .chpat{font-family:var(--sans);font-size:13px;letter-spacing:.06em;color:#4A5A50;display:flex;flex-wrap:wrap;gap:4px}
.chand .chpat i{font-style:normal;padding:2px 6px;border-radius:5px;background:#F4EDDA;font-weight:500}
.chand .chpat i.cR{color:var(--red)} .chand .chpat i.cG{color:var(--grn)} .chand .chpat i.cB{color:var(--blu)}
.chand .chpat i.cN{color:#33413A} .chand .chpat i.cF{color:var(--coral-dk)}
.chand .prog{display:flex;align-items:center;gap:8px}
.chand .bar{flex:1;height:5px;border-radius:3px;background:#EAE2C8;overflow:hidden}
.chand .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .3s}
.chand .away{font-size:10.5px;color:#8A7F5F;letter-spacing:.06em;white-space:nowrap}
.chand .cnote{font-size:10px;color:#A08F63;letter-spacing:.08em}

/* ---------- call bar ---------- */
#callbar{
  position:fixed;left:10px;right:10px;top:130px;bottom:auto;z-index:40;display:none;
  background:rgba(9,42,32,.96);border:1px solid var(--gold);border-radius:16px;padding:12px;
  flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);
}
#callbar.open{display:flex}
#callbar .cq{font-family:var(--serif);font-size:17px;color:var(--gold-pale)}
#callbar .cbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- modal ---------- */
#modal{
  position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(5,20,15,.65);backdrop-filter:blur(4px);padding:24px;
}
#modal.open{display:flex}
#modalin{
  background:var(--ivory);color:var(--ink);border-radius:18px;padding:26px 22px 22px;max-width:340px;width:100%;
  text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);max-height:86dvh;overflow-y:auto;
}
#modalin .mtop{font-size:10px;letter-spacing:.34em;color:var(--gold-dk);margin-bottom:8px}
#modalin h2{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--deep);letter-spacing:.06em;line-height:1.1}
#modalin .msub{font-size:13px;color:#5A6A60;margin:10px 0 4px;line-height:1.5}
#modalin .mtiles{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin:14px 0}
#modalin .mpts{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--coral-dk);margin:6px 0 16px}
#modalin .mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#modalin .rules{text-align:left;font-size:13px;line-height:1.65;color:#3E4E45}
#modalin .rules b{color:var(--deep)}
#modalin .rules p{margin-bottom:9px}

.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="hdr">
  <div class="brand">OOH <b>LA</b> MAHJ</div>
  <div id="wallct">WALL <b id="wallnum">—</b></div>
  <div style="display:flex;align-items:center;gap:7px">
    <button id="btnmat" title="Change mat"></button>
    <button class="hbtn" id="btncard">CARD</button>
    <button class="hbtn" id="btnmenu">MENU</button>
  </div>
</div>

<div id="opps"></div>

<div id="board">
  <div class="btitle">DISCARDS</div>
  <div id="discards"></div>
  <div id="tablemsg" style="display:none"><span id="tablemsgtxt"></span></div>
</div>

<div id="me">
  <div id="myexp"></div>
  <div id="rackbar">
    <button class="mini" id="btnhint">HINT</button>
    <button class="mini" id="btnsort">SORT</button>
  </div>
  <div id="rack"></div>
  <div id="statusline"></div>
  <div id="actions"></div>
</div>

<div id="callbar">
  <div class="cq" id="callq"></div>
  <div class="cbtns" id="callbtns"></div>
</div>

<div id="sheet">
  <div style="flex:1" id="sheetdim"></div>
  <div id="sheetin">
    <div class="grab"></div>
    <h3 id="sheettitle">THE OOH LA MAHJ CARD</h3>
    <div class="sub">F=FLOWER · 0=SOAP · C/X = CONCEALED/EXPOSED</div>
    <div id="cardctl">
      <button class="cbtn" id="ccclub">CLUB CARD</button>
      <button class="cbtn" id="ccmine">MY CARD</button>
      <button class="cbtn imp" id="ccimport">IMPORT…</button>
    </div>
    <div id="cardlist"></div>
  </div>
</div>

<div id="modal"><div id="modalin"></div></div>

<div id="title">
  <div id="titlemural"></div>
  <div class="crest">
    <svg viewBox="0 0 80 80" fill="none">

function parseNums(spec,maxOff){
  let vals=[];
  if(spec==='odd')vals=[1,3,5,7,9];
  else if(spec==='even')vals=[2,4,6,8];
  else if(/^\d+-\d+$/.test(spec)){const [a,b]=spec.split('-').map(Number);for(let i=a;i<=b;i++)vals.push(i)}
  else vals=spec.split(',').map(Number).filter(x=>x>=1&&x<=9);
  return vals.filter(v=>v+maxOff<=9);
}
function suitAssigns(k){
  if(k===0)return [[]];
  const out=[];
  for(const a of SUITS){
    if(k===1){out.push([a]);continue}
    for(const b of SUITS){if(b===a)continue;
      if(k===2){out.push([a,b]);continue}
      for(const c of SUITS){if(c===a||c===b)continue;out.push([a,b,c])}}}
  return out;
}
function expandCompact(cc){
  if(!cc||!Array.isArray(cc.hands)||!cc.hands.length)throw new Error('No hands found in the reading');
  const DRAGS=['GR','GG','G0'];
  const hands=[],fails=[];
  for(const h of cc.hands){
    const seen=new Set(),variants=[];
    let failReason='';
    for(const alt of (h.alts||[])){
      const toks=[];const suitVars=new Set();
      let useN=false,useM=false,useP=false,useDD=false,xRef=null,maxOff=0,bad=false;
      for(const t of (alt.g||[])){
        const mm=/^([1-6]):(.+)$/.exec(String(t).replace(/\s+/g,''));
        if(!mm){bad=true;failReason='could not parse group "'+t+'"';break}
        const k=+mm[1],sp=mm[2];let r;
        if(/^(F|N|E|W|S|0|DR|DG|DW)$/.test(sp)){}
        else if(sp==='dd')useDD=true;
        else if(r=/^d([abc])$/.exec(sp))suitVars.add(r[1]);
        else if(r=/^x([abc])$/.exec(sp)){suitVars.add(r[1]);xRef=r[1]}
        else if(r=/^([1-9])([abc])$/.exec(sp))suitVars.add(r[2]);
        else if(r=/^n([0-6]?)([abc])$/.exec(sp)){useN=true;suitVars.add(r[2]);maxOff=Math.max(maxOff,+(r[1]||0))}
        else if(r=/^m([abc])$/.exec(sp)){useM=true;suitVars.add(r[1])}
        else if(r=/^p([abc])$/.exec(sp)){useP=true;suitVars.add(r[1])}
        else{bad=true;failReason='unknown tile token "'+sp+'"';break}
        toks.push({k,sp});
      }
      if(bad||!toks.length)continue;
      const tot=toks.reduce((s,t)=>s+t.k,0);
      if(tot!==14){failReason='groups total '+tot+' tiles, must be exactly 14';continue}
      const nV=useN?parseNums(String(alt.n||h.n||'1-9'),maxOff):[0];
      const mV=useM?parseNums(String(alt.m||h.m||'1-9'),0):[0];
      const pV=useP?parseNums(String(alt.p||h.p||'1-9'),0):[0];
      const dV=useDD?DRAGS:[null];
      const sv=[...suitVars];
      for(const asg of suitAssigns(sv.length)){
        const smap={};sv.forEach((v,i)=>smap[v]=asg[i]);
        const xV=xRef?DRAGS.filter(d=>d!==DRAGON[smap[xRef]]):[null];
        for(const n of nV)for(const m of mV){
          if(useN&&useM&&m===n)continue;
          for(const p of pV)for(const dd of dV)for(const xx of xV){
            const v=[];let good=true;
            for(const {k,sp} of toks){
              let tk=null,r;
              if(sp==='F')tk='F';
              else if(/^[NEWS]$/.test(sp))tk='W'+sp;
              else if(sp==='0')tk='G0';
              else if(sp==='DR')tk='GR';
              else if(sp==='DG')tk='GG';
              else if(sp==='DW')tk='G0';
              else if(sp==='dd')tk=dd;
              else if(r=/^d([abc])$/.exec(sp))tk=DRAGON[smap[r[1]]];
              else if(r=/^x([abc])$/.exec(sp))tk=xx;
              else if(r=/^([1-9])([abc])$/.exec(sp))tk=smap[r[2]]+r[1];
              else if(r=/^n([0-6]?)([abc])$/.exec(sp)){const num=n+ +(r[1]||0);if(num<1||num>9){good=false;break}tk=smap[r[2]]+num}
              else if(r=/^m([abc])$/.exec(sp))tk=smap[r[1]]+m;
              else if(r=/^p([abc])$/.exec(sp))tk=smap[r[1]]+p;
              if(!tk){good=false;break}
              v.push([tk,k]);
            }
            if(!good)continue;
            const kv=v.map(x=>x[0]+x[1]).sort().join('|');
            if(seen.has(kv)||variants.length>4000)continue;
            seen.add(kv);variants.push(v);
          }
        }
      }
    }
    if(!variants.length){
      fails.push({name:String(h.name||'Hand'),reason:failReason||'no valid arrangements produced'});
      continue;
    }
    hands.push({name:String(h.name||'Hand'),cat:String(h.cat||'CARD'),pts:+h.pts||25,
      concealed:!!h.c,note:String(h.note||''),disp:[[String(h.name||'Hand'),'cN']],variants});
  }
  return {title:String(cc.title||'MY CARD'),hands,fails};
}
function fileToJpeg(file,max=1568){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg',.9).split(',')[1]);
    };
    img.onerror=()=>rej(new Error('Could not read a photo'));
    img.src=URL.createObjectURL(file);
  });
}
let OLM_MODEL=null;
const AIHDRS={'content-type':'application/json','x-api-key':'',
  'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
async function pickModel(){
  if(OLM_MODEL)return OLM_MODEL;

    const r=await fetch('https://api.anthropic.com/v1/models?limit=100',{
      headers:{...AIHDRS,'x-api-key':OLM_API_KEY}});
    if(r.ok){
      const ids=((await r.json()).data||[]).map(m=>m.id);
      const pick=fam=>ids.filter(i=>i.includes(fam)&&!i.includes('haiku')).sort().reverse()[0];
      OLM_MODEL=pick('opus')||pick('sonnet')||ids[0];
    }
  }catch(e){}
  if(!OLM_MODEL)OLM_MODEL='claude-sonnet-4-5';
  window.__modelUsed=OLM_MODEL;
  return OLM_MODEL;
}
async function callAI(content,think){
  const model=await pickModel();
  const body={model,max_tokens:think?20000:16000,messages:[{role:'user',content}]};
  if(think)body.thinking={type:'enabled',budget_tokens:6000};
  else body.temperature=0;
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{...AIHDRS,'x-api-key':OLM_API_KEY},
    body:JSON.stringify(body)});
  if(!r.ok){
    if(r.status===404){OLM_MODEL=null;throw new Error('reading model unavailable — try again')}
    throw new Error(r.status===401?'The card reader is not set up correctly (key)':'The card reading service had a problem ('+r.status+')');
  }
  const j=await r.json();
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text||'').join('').trim();
}
function parseLoose(txt,arr){
  txt=txt.replace(/```(json)?/g,'').trim();
  const o=arr?'[':'{',c=arr?']':'}';
  const a=txt.indexOf(o),b=txt.lastIndexOf(c);
  if(a<0||b<0)throw new Error('Could not understand the reading');
  return JSON.parse(txt.slice(a,b+1));
}
const IMGP=b64=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}});
function cropHalf(file,y0,y1,max=1568){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sh=Math.round(img.height*(y1-y0));
      const sc=Math.min(1,max/Math.max(img.width,sh));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(sh*sc);
      cv.getContext('2d').drawImage(img,0,Math.round(img.height*y0),img.width,sh,0,0,cv.width,cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg',.9).split(',')[1]);
    };
    img.onerror=()=>rej(new Error('Could not read a photo'));
    img.src=URL.createObjectURL(file);
  });
}
const normText=s=>String(s||'').replace(/[^0-9A-Z]/gi,'').toUpperCase();
async function transcribePanel(file){
  const [full,top,bottom]=await Promise.all([
    fileToJpeg(file),cropHalf(file,0,.56),cropHalf(file,.44,1)]);
  async function readCrop(b64,which){
    const p=STAGE_A_PROMPT+`\n\nThis image is the ${which} portion of the panel. A row cut off at the image edge must still be included, with "partial":true added.`;
    const txt=await callAI([{type:'text',text:p},IMGP(b64)],true);
    return parseLoose(txt,true).filter(x=>x&&x.text);
  }
  const [tl,bl]=await Promise.all([readCrop(top,'TOP'),readCrop(bottom,'BOTTOM')]);
  const seen=new Set(),lines=[];
  for(const l of tl){if(l.partial)continue;const k=normText(l.text);if(!seen.has(k)){seen.add(k);lines.push(l)}}
  for(const l of bl){if(l.partial)continue;const k=normText(l.text);if(!seen.has(k)){seen.add(k);lines.push(l)}}
  if(!lines.length)throw new Error('Could not read the panel text');
  try{
    const vtxt=await callAI([{type:'text',text:VERIFY_PROMPT+JSON.stringify(lines)},IMGP(full)],true);
    const vlines=parseLoose(vtxt,true).filter(x=>x&&x.text);
    if(vlines.length>=lines.length*.7)return finish(vlines);
  }catch(e){}
  return finish(lines);
  function finish(ls){window.__reading=(window.__reading||[]).concat(ls);return ls}
}
async function convertLines(lines){
  let extra=null,best=null;
  for(let a=0;a<3;a++){
    const prompt=STAGE_B_HEAD+'\n\nINPUT LINES ('+lines.length+' hands — output exactly '+lines.length+' entries):\n'
      +JSON.stringify(lines)
      +(extra?'\n\nYOUR PREVIOUS ATTEMPT HAD PROBLEMS: '+extra+' — output the complete corrected JSON.':'');
    try{
      const cc=parseLoose(await callAI([{type:'text',text:prompt}],true),false);
      const r=expandCompact(cc);
      if(!best||r.hands.length>best.hands.length)best=r;
      const missing=lines.length-((cc.hands||[]).length);
      if(!r.fails.length&&missing<=0)return r;
      extra=(r.fails.length?'invalid hands: '+r.fails.map(f=>'"'+f.name+'" ('+f.reason+')').join('; '):'')
        +(missing>0?'; you output '+(lines.length-missing)+' of '+lines.length+' hands — every input line needs an entry':'');
    }catch(e){if(a===2&&!best)throw e;extra='previous output was not valid JSON in the required format'}
  }
  return best;
}

/* ---------- custom card ---------- */
function validateCard(c){
  if(!c||typeof c!=='object')return 'Not a card file';
  if(!Array.isArray(c.hands)||!c.hands.length)return 'No hands found';
  const rx=/^([CBD][1-9]|W[NEWS]|G[RG0]|F)$/;
  for(const h of c.hands){
    if(!Array.isArray(h.variants)||!h.variants.length)return 'A hand is missing its patterns';
    if(typeof h.pts!=='number')h.pts=25;
    h.concealed=!!h.concealed;
    h.name=h.name||'Hand';h.cat=h.cat||'CARD';h.note=h.note||'';
    if(!Array.isArray(h.disp))h.disp=[[h.name,'cN']];
    for(const v of h.variants){
      let sum=0;
      for(const g of v){
        if(!Array.isArray(g)||typeof g[0]!=='string'||!rx.test(g[0])||!(g[1]>=1&&g[1]<=6))
          return 'Bad tile group in "'+h.name+'"';
        sum+=g[1];
      }
      if(sum!==14)return 'A pattern in "'+h.name+'" does not total 14 tiles';
    }
  }
  return null;
}
function useCard(which){
  if(which==='custom'&&CUSTOM)HANDS=CUSTOM.hands;
  else{which='club';HANDS=CLUB_HANDS}
  try{localStorage.setItem('olmUse',which)}catch(e){}
}
function activeCardName(){return HANDS===CLUB_HANDS?'club':'custom'}
function bootCard(){
  try{
    const c=JSON.parse(localStorage.getItem('olmCard')||'null');
    if(c&&!validateCard(c))CUSTOM=c;
  }catch(e){}
  let pref='club';
  try{pref=localStorage.getItem('olmUse')||'club'}catch(e){}
  useCard(pref);
}
function saveCustomCard(text){
  let c;
  try{c=JSON.parse(text)}catch(e){return 'That is not valid card data'}
  const err=validateCard(c);
  if(err)return err;
  CUSTOM=c;
  try{localStorage.setItem('olmCard',JSON.stringify(c))}catch(e){return 'Could not save (storage unavailable)'}
  useCard('custom');
  return null;
}

/* ---------- validation ---------- */
function countsOf(tiles){
  const c={};let jk=0;
  for(const t of tiles){if(t.s==='J')jk++;else c[key(t)]=(c[key(t)]||0)+1}
  return {c,jk};
}
function tryVariant(counts,jokers,variant){
  const c=Object.assign({},counts);let jk=jokers;
  for(const [tk,k] of variant){
    if(k<=2){ if((c[tk]||0)<k)return false; c[tk]-=k; }
    else{ const have=Math.min(c[tk]||0,k); c[tk]-=have; const need=k-have;
      if(need>jk)return false; jk-=need; }
  }
  if(jk!==0)return false;
  for(const tk in c)if(c[tk]>0)return false;
  return true;
}
function allTiles(p){return p.hand.concat(...p.exp.map(e=>e.tiles))}
function checkWinTiles(tiles,hasExp){
  if(tiles.length!==14)return null;
  const {c,jk}=countsOf(tiles);
  for(const h of HANDS){
    if(h.concealed&&hasExp)continue;
    for(const v of h.variants) if(tryVariant(c,jk,v)) return {hand:h,variant:v};
  }
  return null;
}
function checkWin(p){return checkWinTiles(allTiles(p),p.exp.length>0)}
function checkWinWith(p,extra){return checkWinTiles(allTiles(p).concat([extra]),p.exp.length>0)}

/* fit scoring: best hand match for progress + bot AI */
function scoreVariant(counts,jk,variant){
  const c=Object.assign({},counts);
  let used=0,slots=0;
  for(const [tk,k] of variant){
    const have=Math.min(c[tk]||0,k); used+=have; c[tk]-=have;
    if(k>=3) slots+=k-have;
  }
  return used+Math.min(jk,slots);
}
function bestFit(p){
  const tiles=allTiles(p),{c,jk}=countsOf(tiles),hasExp=p.exp.length>0;
  let best=null;
  for(const h of HANDS){
    if(h.concealed&&(hasExp||jk>0))continue;
    for(const v of h.variants){
      const s=scoreVariant(c,jk,v);
      if(!best||s>best.score)best={hand:h,variant:v,score:s};
    }
  }
  return best;
}
function keepIdsFor(p,variant){
  const keep=new Set(),taken={};
  for(const [tk,k] of variant)taken[tk]=(taken[tk]||0)+k;
  for(const t of p.hand){
    if(t.s==='J'){keep.add(t.id);continue}
    const tk=key(t);
    if((taken[tk]||0)>0){taken[tk]--;keep.add(t.id)}
  }
  return keep;
}
function handProgress(p){
  const tiles=allTiles(p),{c,jk}=countsOf(tiles),hasExp=p.exp.length>0;
  return HANDS.map(h=>{
    if(h.concealed&&hasExp)return {h,score:0,dead:true};
    let s=0;for(const v of h.variants)s=Math.max(s,scoreVariant(c,jk,v));
    return {h,score:s,dead:false};
  });
}

/* ---------- game state ---------- */
const BOTNAMES=['Evelyn','Dinah','Bitsy'];
let G=null,SEQ=0;
function later(ms,fn){const s=SEQ;setTimeout(()=>{if(s===SEQ&&G&&G.phase!=='over')fn()},ms)}

function newGame(){
  SEQ++;
  _tid=0;
  const wall=shuffle(makeDeck());
  const players=[{name:'You',isBot:false,hand:[],exp:[]}]
    .concat(BOTNAMES.map(n=>({name:n,isBot:true,hand:[],exp:[]})));
  for(let i=0;i<13;i++)for(const p of players)p.hand.push(wall.pop());
  const dealer=Math.floor(Math.random()*4);
  players[dealer].hand.push(wall.pop());
  players[0].hand=sortHand(players[0].hand);
  G={phase:'charleston',wall,players,dealer,turn:dealer,step:'discard',
     chStep:0,sel:new Set(),discards:[],winNow:null};
  $('title').classList.add('hide');
  closeCall();closeModal();
  renderAll();
  showMsg('THE CHARLESTON');
  promptCharleston();
}

/* ---------- charleston ---------- */
const CHDIR=['RIGHT','ACROSS','LEFT'];
function promptCharleston(){
  G.sel.clear();
  setStatus(`Charleston — choose 3 tiles to pass <b>${CHDIR[G.chStep].toLowerCase()}</b>`);
  renderRack();renderActions();
}
function botPassTiles(p){
  const bf=bestFit(p),keep=keepIdsFor(p,bf.variant);
  let cand=p.hand.filter(t=>t.s!=='J'&&!keep.has(t.id));
  const extra=p.hand.filter(t=>t.s!=='J'&&keep.has(t.id));
  shuffle(cand);shuffle(extra);
  cand=cand.concat(extra);
  return cand.slice(0,3);
}
function doCharlestonPass(){
  if(G.sel.size!==3)return;
  const passes=[];
  for(let i=0;i<4;i++){
    const p=G.players[i];
    let out;
    if(i===0){out=p.hand.filter(t=>G.sel.has(t.id))}
    else{out=botPassTiles(p)}
    p.hand=p.hand.filter(t=>!out.includes(t));
    passes.push(out);
  }
  const off=[1,2,3][G.chStep];
  for(let i=0;i<4;i++){
    G.players[(i+off)%4].hand.push(...passes[i]);
  }
  G.sel.clear();
  G.chStep++;
  renderAll();
  if(G.chStep<3){
    showMsg('PASS '+CHDIR[G.chStep]);
    promptCharleston();
  }else{
    startPlay();
  }
}
function startPlay(){
  G.phase='play';G.turn=G.dealer;G.step='discard';
  showMsg('GAME ON');
  setStatus(G.dealer===0?'You are East — discard to begin':`<b>${G.players[G.dealer].name}</b> is East`);
  renderAll();
  if(G.turn===0)playerDiscardPhase();
  else later(1100,()=>botAct());
}

/* ---------- turn flow ---------- */
function nextTurnFrom(i){
  G.turn=(i+1)%4;G.step='draw';
  renderAll();
  if(G.turn===0)later(500,playerDraw);
  else later(900,botAct);
}
function playerDraw(){
  if(!G.wall.length)return wallGame();
  const t=G.wall.pop();
  G.players[0].hand.push(t);
  G.step='discard';
  setStatus(`You draw <b>${nameOf(t)}</b>`);
  renderAll();
  playerDiscardPhase();
}
function playerDiscardPhase(){
  G.winNow=checkWin(G.players[0]);
  G.sel.clear();
  renderRack();renderActions();
  if(!G.winNow)setStatus('Your turn — select a tile to discard');
}
function findJokerSwap(){
  const me=G.players[0];
  for(const p of G.players)for(const e of p.exp){
    const j=e.tiles.find(t=>t.s==='J');
    if(!j)continue;
    const real=me.hand.find(t=>key(t)===e.rep);
    if(real)return {e,j,real};
  }
  return null;
}
function doJokerSwap(){
  const sw=findJokerSwap();if(!sw)return;
  const me=G.players[0];
  me.hand=me.hand.filter(t=>t!==sw.real);
  const idx=sw.e.tiles.indexOf(sw.j);
  sw.e.tiles[idx]=sw.real;
  me.hand.push(sw.j);
  setStatus(`You swap <b>${nameOf(sw.real)}</b> for a <b>Joker</b>`);
  renderAll();
  playerDiscardPhase();
}
function discardSelected(){
  if(G.sel.size!==1)return;
  const me=G.players[0];
  const t=me.hand.find(x=>G.sel.has(x.id));
  me.hand=me.hand.filter(x=>x!==t);
  G.sel.clear();
  G.discards.push({t,by:0});
  setStatus(`You discard <b>${nameOf(t)}</b>`);
  renderAll();
  afterDiscard(0,t);
}
function afterDiscard(by,t){
  if(t.s==='J'){later(700,()=>nextTurnFrom(by));return}
  if(by!==0){
    const me=G.players[0];
    const win=checkWinWith(me,t);
    const {c,jk}=countsOf(me.hand);
    const copies=c[key(t)]||0;
    const opts=[];
    if(win)opts.push({label:'MAH JONGG!',cls:'gold',fn:()=>playerCallWin(t,win)});
    const callable=copies>=2||(copies>=1&&jk>=1)||jk>=2;
    if(callable){
      for(const k of [3,4,5]){
        const need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
        if(jNeed<=jk&&copies+jk>=need&&(realUse+jNeed===need))
          opts.push({label:k===3?'PUNG':k===4?'KONG':'QUINT',cls:'',fn:()=>playerCallExpose(t,k)});
      }
    }
    if(opts.length){openCallBar(t,opts,()=>botClaims(by,t));return}
  }
  botClaims(by,t);
}
function botClaims(by,t){
  for(let j=1;j<4;j++){
    if(j===by)continue;
    const p=G.players[j];
    const win=checkWinWith(p,t);
    if(win){
      G.discards.pop();
      p.hand.push(t);
      declareWin(j,checkWin(p)||win);
      return;
    }
  }
  for(let j=1;j<4;j++){
    if(j===by)continue;
    const p=G.players[j];
    const bf=bestFit(p);
    const grp=bf.variant.find(([tk,k])=>tk===key(t)&&k>=3);
    if(!grp)continue;
    const {c,jk}=countsOf(p.hand);
    const copies=c[key(t)]||0;
    if(copies<2)continue;
    const k=grp[1],need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
    if(jNeed>jk)continue;
    if(Math.random()<0.8){
      G.discards.pop();
      const used=[];
      for(const x of p.hand){if(key(x)===key(t)&&used.length<realUse)used.push(x)}
      let jc=0;
      for(const x of p.hand){if(x.s==='J'&&jc<jNeed){used.push(x);jc++}}
      p.hand=p.hand.filter(x=>!used.includes(x));
      p.exp.push({tiles:[t,...used],rep:key(t)});
      G.turn=j;G.step='discard';
      setStatus(`<b>${p.name}</b> calls <b>${nameOf(t)}</b>!`);
      renderAll();
      later(1200,()=>botDiscard(p,j));
      return;
    }
  }
  nextTurnFrom(by);
}
function playerCallExpose(t,k){
  closeCall();
  const me=G.players[0];
  G.discards.pop();
  const {c}=countsOf(me.hand);
  const copies=c[key(t)]||0,need=k-1,realUse=Math.min(copies,need),jNeed=need-realUse;
  const used=[];
  for(const x of me.hand){if(key(x)===key(t)&&used.filter(u=>u.s!=='J').length<realUse)used.push(x)}
  let jc=0;
  for(const x of me.hand){if(x.s==='J'&&jc<jNeed){used.push(x);jc++}}
  me.hand=me.hand.filter(x=>!used.includes(x));
  me.exp.push({tiles:[t,...used],rep:key(t)});
  G.turn=0;G.step='discard';
  setStatus(`You call <b>${nameOf(t)}</b> — now discard`);
  renderAll();
  playerDiscardPhase();
}
function playerCallWin(t,win){
  closeCall();
  G.discards.pop();
  G.players[0].hand.push(t);
  declareWin(0,win);
}
function botAct(){
  const j=G.turn,p=G.players[j];
  if(G.step==='draw'){
    if(!G.wall.length)return wallGame();
    p.hand.push(G.wall.pop());
    G.step='discard';
    setStatus(`<b>${p.name}</b> draws…`);
    renderAll();
    const win=checkWin(p);
    if(win){later(900,()=>declareWin(j,win));return}
    later(850,()=>botDiscard(p,j));
  }else{
    const win=checkWin(p);
    if(win){later(900,()=>declareWin(j,win));return}
    botDiscard(p,j);
  }
}
function botDiscard(p,j){
  const bf=bestFit(p),keep=keepIdsFor(p,bf.variant);
  let cand=p.hand.filter(t=>t.s!=='J'&&!keep.has(t.id));
  if(!cand.length)cand=p.hand.filter(t=>t.s!=='J');
  if(!cand.length)cand=[...p.hand];
  const t=cand[Math.floor(Math.random()*cand.length)];
  p.hand=p.hand.filter(x=>x!==t);
  G.discards.push({t,by:j});
  setStatus(`<b>${p.name}</b> discards <b>${nameOf(t)}</b>`);
  renderAll();
  later(600,()=>afterDiscard(j,t));
}

/* ---------- call bar ---------- */
let callTimer=null;
function openCallBar(t,opts,onPass){
  const bar=$('callbar');

  const bb=$('callbtns');bb.innerHTML='';
  for(const o of opts){
    const b=document.createElement('button');

  const pass=document.createElement('button');

let DRAG=false,HINTON=false,HINTIDX=0;
function topFits(p){
  const tiles=allTiles(p),{c,jk}=countsOf(tiles),hasExp=p.exp.length>0;
  const list=[];
  for(const h of HANDS){
    if(h.concealed&&(hasExp||jk>0))continue;
    let best=null;
    for(const v of h.variants){
      const s=scoreVariant(c,jk,v);
      if(!best||s>best.score)best={hand:h,variant:v,score:s};
    }
    if(best)list.push(best);
  }
  list.sort((a,b)=>b.score-a.score);
  return list.slice(0,5);
}
function renderRack(){
  if(DRAG)return;
  const box=$('rack');box.innerHTML='';
  const me=G.players[0];
  let hintKeep=null;
  if(HINTON&&(G.phase==='charleston'||G.phase==='play')){
    const fits=topFits(me);
    if(fits.length){
      if(HINTIDX>=fits.length)HINTIDX=0;
      hintKeep=keepIdsFor(me,fits[HINTIDX].variant);
    }
  }
  for(const t of me.hand){
    const td=tileDOM(t,'t-lg');
    if(G.sel.has(t.id))td.classList.add('sel');
    if(hintKeep){if(hintKeep.has(t.id))td.classList.add('hint');else td.classList.add('dim')}
    td.addEventListener('pointerdown',e=>rackPointer(e,t,td));
    box.appendChild(td);
  }
}
function rackPointer(e,t,td){
  if(!G||G.phase==='over')return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;let clone=null;
  const move=ev=>{
    if(!DRAG&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){
      DRAG=true;
      clone=td.cloneNode(true);
      clone.classList.remove('sel');
      clone.style.cssText='position:fixed;z-index:999;pointer-events:none;margin:0;width:'+td.offsetWidth+'px;height:'+td.offsetHeight+'px;opacity:.95;transform:scale(1.12);transition:none';
      document.body.appendChild(clone);
      td.style.opacity='.25';
    }
    if(DRAG&&clone){
      clone.style.left=(ev.clientX-td.offsetWidth/2)+'px';
      clone.style.top=(ev.clientY-td.offsetHeight*.9)+'px';
    }
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    if(DRAG){
      DRAG=false;
      if(clone)clone.remove();
      td.style.opacity='';
      const me=G.players[0];
      const kids=[...$('rack').children];
      let best=-1,bd=Infinity;
      kids.forEach((k,i)=>{
        const r=k.getBoundingClientRect();
        const d=Math.pow(ev.clientX-(r.left+r.width/2),2)+Math.pow(ev.clientY-(r.top+r.height/2),2);
        if(d<bd){bd=d;best=i}
      });
      if(best>=0){
        const r=kids[best].getBoundingClientRect();
        let target=best+(ev.clientX>r.left+r.width/2?1:0);
        const old=me.hand.indexOf(t);
        if(old>=0){
          me.hand.splice(old,1);
          if(target>old)target--;
          if(target<0)target=0;
          if(target>me.hand.length)target=me.hand.length;
          me.hand.splice(target,0,t);
        }
      }
      renderRack();
    }else{
      tapTile(t);
    }
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}
function tapTile(t){
  if(G.phase==='charleston'){
    if(t.s==='J'){setStatus('Jokers may never be passed, darling');return}
    if(G.sel.has(t.id))G.sel.delete(t.id);
    else if(G.sel.size<3)G.sel.add(t.id);
    renderRack();renderActions();
  }else if(G.phase==='play'&&G.turn===0&&G.step==='discard'){
    if(G.sel.has(t.id))G.sel.delete(t.id);
    else{G.sel.clear();G.sel.add(t.id)}
    renderRack();renderActions();
  }
}
function renderActions(){
  const box=$('actions');box.innerHTML='';
  const mk=(label,cls,fn,dis)=>{
    const b=document.createElement('button');
    b.className='abtn '+cls;b.innerHTML=label;b.onclick=fn;b.disabled=!!dis;
    box.appendChild(b);return b;
  };
  if(G.phase==='charleston'){
    mk(`PASS ${G.sel.size}/3 ${CHDIR[G.chStep]}`,G.sel.size===3?'':'ghost',doCharlestonPass,G.sel.size!==3);
  }else if(G.phase==='play'&&G.turn===0&&G.step==='discard'){
    if(G.winNow)mk('MAH JONGG!','gold',()=>declareWin(0,G.winNow));
    if(findJokerSwap())mk('SWAP JOKER','ghost',doJokerSwap);
    mk('DISCARD','',discardSelected,G.sel.size!==1);
  }
}

async function convertPhotos(files,backToSheet){
  const box=$('modalin');
  const msgs=['Reading your card…','Transcribing the hands…','Checking every pattern…','Setting your table…'];
  box.innerHTML=`<div class="mtop">OOH LA MAHJ</div><h2 style="font-size:23px">Reading your card</h2>
    <div class="spin"></div>
    <div class="msub" id="convmsg">${msgs[0]}</div>
    <div class="msub" style="font-size:11px;color:#A08F63">This takes about a minute — keep this page open.</div>`;
  let mi=0;const mt=setInterval(()=>{const el=$('convmsg');if(el)el.textContent=msgs[++mi%msgs.length]},9000);
  window.__reading=[];
  try{
    async function readPanel(file){
      const lines=await transcribePanel(file);
      const r=await convertLines(lines);
      if(r&&lines.length>r.hands.length+r.fails.length){
        r.fails.push({name:(lines.length-r.hands.length-r.fails.length)+' line(s) from this panel',reason:'missing from conversion'});
      }
      return r;
    }
    const results=await Promise.all(files.map(readPanel));
    const hands=[],fails=[];
    let title='MY CARD';
    for(const r of results){
      if(!r)continue;
      if(r.title&&r.title!=='MY CARD')title=r.title;
      hands.push(...r.hands);fails.push(...r.fails);
    }
    if(!hands.length)throw new Error('Could not read any hands from the photos');
    const card={title,hands};
    const bad=validateCard(card);
    if(bad)throw new Error(bad);
    clearInterval(mt);
    reviewCard(card,fails,backToSheet);
  }catch(e){
    clearInterval(mt);
    box.innerHTML=`<div class="mtop">OOH LA MAHJ</div><h2 style="font-size:23px">Hmm, that didn't work</h2>
      <div class="msub">${(e&&e.message)||'Something went wrong reading the photos.'}<br><br>Try retaking the photos — flat card, bright light, one full panel per photo.</div>
      <div class="mbtns" style="margin-top:14px"><button class="abtn" id="rtry">TRY AGAIN</button>
      <button class="abtn ghost" style="color:var(--deep);border-color:#B9AD8B" id="rcancel">${backToSheet?'CANCEL':'USE THE CLUB CARD'}</button></div>`;
    box.querySelector('#rtry').onclick=()=>openImport(backToSheet);
    box.querySelector('#rcancel').onclick=()=>{closeModal();if(backToSheet)openSheet()};
  }
}

function blossomSVG(x,y,r,th,op){
  let s='';
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2-Math.PI/2;
    s+=`<circle cx="${(x+Math.cos(a)*r).toFixed(1)}" cy="${(y+Math.sin(a)*r).toFixed(1)}" r="${(r*.78).toFixed(1)}" fill="${i%2?th.blossom:th.blossom2}" opacity="${op}"/>`;
  }
  s+=`<circle cx="${x}" cy="${y}" r="${(r*.4).toFixed(1)}" fill="${th.heart}" opacity="${op+0.1}"/>`;
  return s;
}
function budSVG(x,y,th){
  return `<circle cx="${x}" cy="${y}" r="4.5" fill="${th.blossom2}" opacity=".5"/><circle cx="${x+7}" cy="${y-6}" r="3" fill="${th.blossom}" opacity=".45"/>`;
}
function leafSVG(x,y,rot,th){
  return `<ellipse cx="${x}" cy="${y}" rx="11" ry="4.2" fill="${th.leaf}" opacity=".5" transform="rotate(${rot} ${x} ${y})"/>`;
}
function muralURI(th){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620">
  <g fill="none" stroke="${th.branch}" stroke-linecap="round" opacity=".55">
    <path d="M-12 618 C 55 545 88 480 148 434 C 208 388 262 372 306 330" stroke-width="3.2"/>
    <path d="M148 434 C 168 402 174 372 163 338" stroke-width="2.4"/>
    <path d="M92 500 C 132 486 166 484 198 462" stroke-width="2.2"/>
    <path d="M262 372 C 276 398 300 412 330 414" stroke-width="2"/>
    <path d="M412 52 C 352 84 322 126 282 148 C 242 170 222 204 214 246" stroke-width="2.8"/>
    <path d="M282 148 C 272 118 278 92 294 70" stroke-width="2"/>
    <path d="M322 126 C 344 138 366 138 386 128" stroke-width="1.8"/>
  </g>
  ${leafSVG(120,466,-32,th)}${leafSVG(180,420,-20,th)}${leafSVG(236,388,-14,th)}
  ${leafSVG(84,516,-45,th)}${leafSVG(302,352,-30,th)}${leafSVG(252,182,28,th)}
  ${leafSVG(236,220,40,th)}${leafSVG(306,116,18,th)}${leafSVG(174,448,-26,th)}
  ${blossomSVG(163,332,11,th,.6)}${blossomSVG(306,324,13,th,.6)}${blossomSVG(200,458,9.5,th,.55)}
  ${blossomSVG(296,64,11,th,.6)}${blossomSVG(214,252,9,th,.55)}${blossomSVG(334,416,10,th,.55)}
  ${blossomSVG(390,124,8.5,th,.5)}${budSVG(120,480,th)}${budSVG(260,164,th)}${budSVG(60,548,th)}
  <g opacity=".62">
    <path d="M226 380 q16 -14 38 -9 q-11 7 -13 14 q16 -3 25 7 q-18 2 -27 11 q-4 14 -18 18 q5 -11 3 -20 q-13 4 -22 -1 q9 -6 14 -20 z" fill="${th.bird}"/>
    <circle cx="258" cy="368" r="1.6" fill="${th.bg3}"/>
  </g>
  <g opacity=".5">
    <path d="M96 150 q10 -9 24 -6 q-7 5 -8 9 q10 -2 16 5 q-11 1 -17 7 q-3 9 -12 12 q3 -7 2 -13 q-8 3 -14 -1 q6 -4 9 -13 z" fill="${th.bird}"/>
  </g>
</svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
let MAT=0;
function applyMat(i){
  MAT=i;
  const th=THEMES[i],rs=document.documentElement.style;
  rs.setProperty('--bg1',th.bg1);rs.setProperty('--bg2',th.bg2);rs.setProperty('--bg3',th.bg3);
  const uri=muralURI(th);
  const bd=$('board');
  bd.style.backgroundImage=`url("${uri}")`;
  bd.style.backgroundSize='cover';bd.style.backgroundPosition='center';
  $('titlemural').style.backgroundImage=`url("${uri}")`;
  $('btnmat').style.background=`conic-gradient(${th.bg1} 0 33%, ${th.blossom} 33% 66%, ${th.branch} 66% 100%)`;
  document.querySelector('meta[name=theme-color]').setAttribute('content',th.bg2);
  document.querySelectorAll('.matsw').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('matname').textContent=th.name;
}
(function buildMatRow(){
  const row=$('matrow');
  THEMES.forEach((th,i)=>{
    const b=document.createElement('button');
    b.className='matsw';
    b.style.background=`linear-gradient(140deg, ${th.bg1} 30%, ${th.blossom} 100%)`;
    b.onclick=()=>applyMat(i);
    row.appendChild(b);
  });
})();
$('btnmat').onclick=()=>applyMat((MAT+1)%THEMES.length);
applyMat(0);
bootCard();
(function(){
  let seen=false;
  try{seen=!!localStorage.getItem('olmSeen')}catch(e){}
  if(!seen&&!CUSTOM)showWelcome();
  else{try{localStorage.setItem('olmSeen','1')}catch(e){}}
})();
</script>
